// Eén ingang naar de opslag. Spreadsheet: een Google Apps Script-webapp (POST als platte tekst, dan geen CORS-voorvraag).
// Supabase: alleen via functies (RPC); de tabellen zelf zijn dicht. De sleutel bewijst dat jij de calculator bent.
async function inmApi(actie, data = {}) {
  const c = INM.cfg;
  if (c.soort === 'demo') return inmDemo(actie, data);
  if (!navigator.onLine) throw new Error('Geen internet');
  if (c.soort === 'sheet') {
    if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(c.url || '')) throw new Error('Vul in Instellingen de link van het script in');
    const r = await fetch(c.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ actie, sleutel: c.sleutel, van: c.naam || '', antw: c.mail || '', ...data }) });
    const j = await r.json().catch(() => { throw new Error('Het script gaf geen goed antwoord. Staat "Toegang" op Iedereen?'); });
    if (j.fout) throw new Error(j.fout); return j;
  }
  if (c.soort === 'supabase') {
    if (!/^https:\/\//.test(String(c.url || '').trim()) || !c.key) throw new Error('Vul eerst de koppeling in: Project URL en key van Supabase (Instellingen > Inmeetaanvragen).');
    const fn = { lijst: 'inm_lijst', status: 'inm_status', pak: 'inm_pak', wvbLijst: 'inm_wvb_lijst', wvbToevoegen: 'inm_wvb_toevoegen', wvbVerwijder: 'inm_wvb_verwijder' }[actie];
    const args = { p_sleutel: c.sleutel }; for (const [k, v] of Object.entries(data)) args['p_' + k] = v;
    const r = await fetch(String(c.url || '').replace(/\/+$/, '') + '/rest/v1/rpc/' + fn, { method: 'POST',
      headers: { apikey: c.key, ...(/^eyJ/.test(c.key || '') ? { Authorization: 'Bearer ' + c.key } : {}), 'Content-Type': 'application/json' }, body: JSON.stringify(args) });
    const j = await r.json().catch(() => null);
    if (!r.ok) throw new Error(j?.message || ([401, 403].includes(r.status) ? 'Supabase weigert de key. Kijk of je de anon key goed hebt geplakt.' : r.status === 404 || r.status === 405 ? 'Supabase vindt de functies niet. Klopt de Project URL, en heb je de SQL gedraaid?' : 'Supabase gaf fout ' + r.status));
    return Array.isArray(j) ? { items: j } : j;
  }
  throw new Error('Nog niet gekoppeld');
}
function inmDemo(actie, data) {
  let l = leesJ(INM_DEMO_KEY, null); if (!l) { l = inmDemoData(); zetJ(INM_DEMO_KEY, l); }
  if (actie === 'lijst') return { items: l };
  if (actie === 'status') { const x = l.find(y => y.id === data.id); if (x) { x.status = data.status; zetJ(INM_DEMO_KEY, l); } return { ok: true, mail: false, demo: true }; }
  if (actie === 'pak') { const x = l.find(y => y.id === data.id); if (x) { x.door = data.door || ''; zetJ(INM_DEMO_KEY, l); } return { ok: true }; }
  if (actie === 'wvbLijst') return { items: [{ naam: 'Sanne (voorbeeld)', email: '', token: 'voorbeeld' }] };
  return { ok: true };
}

// Adres → plek op de kaart via PDOK (de gratis adressendienst van de overheid). Eén keer per adres; daarna onthouden.
async function inmGeo() {
  const nieuw = INM.lijst.filter(x => x.lat == null && !INM.geo[x.adres]).slice(0, 60);
  for (const x of nieuw) {
    try {
      const r = await fetch('https://api.pdok.nl/bzk/locatieserver/search/v3_1/free?rows=1&fq=type:adres&fl=centroide_ll,woonplaatsnaam,wijknaam,buurtnaam&q=' + encodeURIComponent(x.adres));
      const d = (await r.json())?.response?.docs?.[0];
      const n = d?.centroide_ll?.match(/-?[\d.]+/g)?.map(Number);
      INM.geo[x.adres] = n ? { lat: n[1], lng: n[0], plaats: d.woonplaatsnaam || '', wijk: d.wijknaam || d.buurtnaam || '' } : {};
    } catch { break; }
  }
  zetJ(INM_GEO_KEY, INM.geo);
}
const inmPlek = x => x.lat != null ? x : (INM.geo[x.adres] || {});
function inmKm(a, b) {
  const p = inmPlek(a), q = inmPlek(b); if (p.lat == null || q.lat == null) return 99;
  const r = Math.PI / 180, dLa = (q.lat - p.lat) * r, dLo = (q.lng - p.lng) * r;
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(p.lat * r) * Math.cos(q.lat * r) * Math.sin(dLo / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(h));
}
const inmMin = (x, l) => l.reduce((m, y) => Math.min(m, inmKm(x, y)), 99);
const inmStraat = a => String(a).split(',')[0].replace(/\s+\d.*$/, '').trim();
const inmPlaats = x => inmPlek(x).plaats || (String(x.adres).split(',')[1] || '').trim();

// De planning: 1) deadline binnen 7 dagen, 2) per opdracht genoeg om de deadline te halen, 3) wat binnen 1,5 km ligt gaat mee.
function inmPlan() {
  const D = 864e5, nu = new Date(); nu.setHours(0, 0, 0, 0);
  const ik = inmIk(), open = INM.lijst.filter(x => x.status !== 'ingemeten' && (!x.door || x.door === ik));
  const dl = x => x.deadline ? new Date(x.deadline + 'T12:00:00') : new Date(nu.getTime() + 120 * D);
  const pk = {}; open.forEach(x => (pk[(x.opdrachtgever || '') + '|' + (x.deadline || '')] ??= []).push(x));
  const week = new Map(), maand = new Map();
  const zet = (m, x, why) => { if (!week.has(x.id) && !maand.has(x.id)) m.set(x.id, { x, why }); };
  open.filter(x => dl(x) - nu <= 7 * D).sort((a, b) => dl(a) - dl(b)).forEach(x => zet(week, x, 'spoed'));
  const tempo = l => Math.ceil(l.length / Math.max(1, (dl(l[0]) - nu) / (7 * D)));
  Object.values(pk).forEach(l => {
    const ref = [...week.values()].map(v => v.x), n = tempo(l) - l.filter(x => week.has(x.id)).length;
    l.filter(x => !week.has(x.id)).sort((a, b) => inmMin(a, ref) - inmMin(b, ref)).slice(0, Math.max(0, n)).forEach(x => zet(week, x, 'tempo'));
  });
  const basis = [...week.values()].map(v => v.x);
  open.filter(x => !week.has(x.id)).sort((a, b) => inmMin(a, basis) - inmMin(b, basis)).forEach(x => {
    const ok = inmMin(x, basis) < 1.5 || basis.some(b => inmKm(x, b) === 99 && inmStraat(b.adres) === inmStraat(x.adres));
    if (ok && week.size < 30) zet(week, x, 'buurt'); });
  open.filter(x => dl(x) - nu <= 31 * D).forEach(x => zet(maand, x, 'maand'));
  Object.values(pk).forEach(l => l.filter(x => !week.has(x.id) && !maand.has(x.id)).slice(0, tempo(l) * 3).forEach(x => zet(maand, x, 'tempo')));
  const later = open.filter(x => !week.has(x.id) && !maand.has(x.id)).map(x => ({ x }));
  return { week: [...week.values()], maand: [...maand.values()], later, dl };
}
// Per dag één gebied: adressen binnen 2,5 km (of in dezelfde straat) horen bij elkaar. Volgorde: dichtstbijzijnde eerst.
function inmDagen(week, dl) {
  const groepen = [];
  [...week].sort((a, b) => dl(a.x) - dl(b.x)).forEach(v => {
    const g = groepen.find(g => inmKm(g[0].x, v.x) < 2.5 || (inmKm(g[0].x, v.x) === 99 && (inmStraat(g[0].x.adres) === inmStraat(v.x.adres) || inmPlaats(g[0].x) && inmPlaats(g[0].x) === inmPlaats(v.x))));
    g ? g.push(v) : groepen.push([v]);
  });
  return groepen.map(g => { const uit = [g.shift()]; while (g.length) { const l = uit.at(-1).x; g.sort((a, b) => inmKm(l, a.x) - inmKm(l, b.x)); uit.push(g.shift()); } return uit; });
}
function inmWerkdagen(n) {
  const uit = [], d = new Date(); d.setHours(12, 0, 0, 0);
  while (uit.length < n) { if (d.getDay() % 6) uit.push(new Date(d)); d.setDate(d.getDate() + 1); }
  return uit;
}

// Collega: krijgt een afgeleide sleutel (SHA-256 van "collega:" + jouw sleutel). Supabase of het script rekent die zelf na.
// Daarmee kan hij de lijst zien, "Ik pak dit" en "Ingemeten", maar geen werkvoorbereiders zien of toevoegen en jouw sleutel niet terugvinden.
const inmIsCol = () => INM.cfg.rol === 'collega';
async function inmColSleutel(s) {
  const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('collega:' + s));
  return Array.from(new Uint8Array(h), b => b.toString(16).padStart(2, '0')).join('');
}
const inmNieuweSleutel = () => Array.from(crypto.getRandomValues(new Uint8Array(12)), b => b.toString(16).padStart(2, '0')).join('');
function inmLink(token) {
  const c = INM.cfg, h = new URLSearchParams({ b: c.soort === 'supabase' ? 'sb' : 'sheet', u: c.url || '', ...(c.soort === 'supabase' ? { k: c.key || '' } : {}), t: token });
  return AANVRAAG_URL + '#' + h.toString();
}

}

const INM_APP = 'https://buildcalc-pro.github.io/buildcalc-updates/app/';
const INMLIJST_URL = 'https://buildcalc-pro.github.io/buildcalc-updates/inmeten/';
async function inmKoppelCode(t) {
  const mt = String(t).match(/BCK1:([A-Za-z0-9+/=]+)/);
  try {
    if (!mt) throw 0; const d = JSON.parse(decodeURIComponent(escape(atob(mt[1]))));
    if (!['sheet', 'supabase'].includes(d.s) || !d.u || !d.sl) throw 0;
    const col = d.r === 'c';
    const naam = await vraagTekst('Inmeten koppelen', col ? `Koppeling van ${d.n || 'je collega'}. Wat is jouw naam?` : 'Wie gebruikt deze BuildCalc? Klopt de naam, tik dan op OK.', 'Bijv. Peter', col ? '' : d.n || '');
    if (naam == null) return;
    INM.cfg = col ? { soort: d.s, url: d.u, key: d.k || '', sleutel: d.sl, naam: naam.trim(), rol: 'collega', van: d.n || '' }
      : { soort: d.s, url: d.u, key: d.k || '', sleutel: d.sl, naam: naam.trim(), mail: naam.trim() === (d.n || '') ? d.m || '' : '' }; inmBewaarCfg();
    INM.lijst = []; INM.gehaald = 0; INM.fout = ''; zetJ(INM_LIJST_KEY, []);

}

    dikteCm = Math.max(0, Math.round(getal(String(v).replace(',', '.')) || 0)); try { localStorage.setItem(DIKTE_KEY, String(dikteCm)); } catch {} render(); });
  // Kopjes inklappen; de stand blijft bewaard. Een korte samenvatting staat rechts in het kopje.
  const kort = { updates: Native ? 'versie ' + APP_VERSIE : '', lasermeter: Laser.status === 'verbonden' ? 'verbonden' : '', thema: { donker: 'Donker', licht: 'Licht', zon: 'Zon' }[thema] || '' };
  m.querySelectorAll('.isec').forEach(sec => {
    const h = sec.firstElementChild, sleutel = h.textContent.trim().toLowerCase().replace(/[^a-z]+/g, '-').replace(/^-|-$/g, '');
    sec.classList.add('klap'); sec.classList.toggle('dicht', !instOpen.has(sleutel));
    if (kort[sleutel]) { h.insertAdjacentHTML('beforeend', `<span class="kort" data-nt>${esc(kort[sleutel])}</span>`); h.classList.add('metkort'); }
    h.setAttribute('role', 'button'); h.tabIndex = 0;
    const wissel = () => { instOpen.has(sleutel) ? instOpen.delete(sleutel) : instOpen.add(sleutel); sec.classList.toggle('dicht', !instOpen.has(sleutel));
      try { localStorage.setItem(INST_OPEN_KEY, [...instOpen].join(',')); } catch {} };
    h.onclick = wissel; h.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); wissel(); } };
  });
  m.querySelectorAll('[data-taal]').forEach(b => b.onclick = () => { zetTaal(b.dataset.taal); render(); });
  inmInstKoppel(m);
  toonFotoOpslag(m); // Slim herkennen (AI, Gemini, geleerde woorden) is weg: de app werkt zonder AI.
  if ($('#iTelAi', m)) $('#iTelAi', m).onclick = async () => { $('#iTelAi', m).disabled = true; await telAiStart(true); if (tab === 'instellingen') render(); toast(telAi() ? 'AI van de telefoon staat aan' : telAiUitleg()); }; 
  $('#iMaak', m).onclick = () => backupMaken();
  $('#iTerug', m).onclick = backupTerugzetten;
  $('#iDrive', m).onclick = backupNaarDrive;
  if ($('#iUpd', m)) $('#iUpd', m).onclick = () => zoekUpdate(true);
  const vak = $('#iLaser', m), laser = () => { if (!vak.isConnected) { Laser.luisteraars.delete(laser); return; } vak.innerHTML = laserKnopHtml(); koppelLaserKnop(vak); };
  Laser.luisteraars.add(laser); laser();
  const bij = () => { if (!m.isConnected || tab !== 'instellingen' || !$('#iUpd', m) && Native) { UPD.luisteraars.delete(bij); AI.luisteraars.delete(bij); return; } UPD.luisteraars.delete(bij); AI.luisteraars.delete(bij); render(); };
  UPD.luisteraars.add(bij); AI.luisteraars.add(bij);
}
$('#instel').onclick = () => { tab = 'instellingen'; render(); };

render();
if (/koppel=BCK1/.test(location.hash)) { const k = decodeURIComponent(location.hash); history.replaceState(null, '', location.pathname + location.search); setTimeout(() => inmKoppelCode(k), 300); }
else if (inmGekoppeld()) setTimeout(() => inmHaal(true), 2000); // aantal voor het bolletje op Inmeten
// Geen AI meer bij het starten (spraak en Gemini zijn uit de app): dat scheelt batterij en netwerk.
if (Native) setTimeout(zoekUpdate, 1500);
// Android-terugknop: één scherm terug, net als de terug-pijl linksboven. Op het beginscherm gaat de app naar de achtergrond.
function androidTerug() {
  const scrims = document.querySelectorAll('.scrim'); if (scrims.length) return scrims[scrims.length - 1].click();
  const v = document.querySelector('.viewer'); if (v) { const k = v.querySelector('#vsluit'); return k ? k.click() : sluitViewer(); }
  if (PAG) return sluitPagina();
  const k = document.querySelector('#main #terug'); if (k) return k.click();
  if (tab !== 'projecten') { tab = 'projecten'; return render(); }
  try { plugin('App')?.minimizeApp?.()?.catch?.(() => {}); } catch {}
}
try { Promise.resolve(plugin('App')?.addListener?.('backButton', androidTerug)).catch(() => {}); } catch {}
// Ook als je de app weer opent vanuit de achtergrond (zonder hem af te sluiten) kijken we, hooguit eens per 10 minuten.
let laatsteUpdateCheck = Date.now();
document.addEventListener('visibilitychange', () => {
  if (!Native || document.visibilityState !== 'visible' || Date.now() - laatsteUpdateCheck < 600000) return;
  laatsteUpdateCheck = Date.now(); setTimeout(zoekUpdate, 1500);
});

</script>
