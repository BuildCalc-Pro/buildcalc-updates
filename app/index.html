<style>
:root {
  /* Olijfbrons nacht */
  --bg: #12110D; --surface: #1C1A14; --surface-high: #29261D;
  --gold: #C2AD6E; --gold-dark: #A8935A; --text: #EFECE4; --muted: #A39D8F;
  --select: #D4AF37; --danger: #F87171; --ok: #86EFAC; --open: #FBBF24;
  --a2: var(--gold); --a2-dark: var(--gold-dark);
  color-scheme: dark;
}
:root[data-theme=light] {
  /* Warm wit met olijfbrons */
  --bg: #F8F7F4; --surface: #ffffff; --surface-high: #E2DCCF;
  --gold: #7B6A3C; --gold-dark: #62542F; --text: #14120E; --muted: #4B463E;
  --a2: #1D5FD1; --a2-dark: #1A4FAE; /* blauw voor kopjes, aantallen en nummers */
  --select: #D4AF37; --danger: #C62828; --ok: #2F7D4A; --open: #B45309;
  color-scheme: light;
}
:root[data-theme=zon] {
  --bg: #ffffff; --surface: #ffffff; --surface-high: #e6e6e6;
  --gold: #7a5c00; --gold-dark: #5e4600; --text: #000000; --muted: #333333;
  --select: #D4AF37; --danger: #b00020; --ok: #1b5e20; --open: #b35900;
  color-scheme: light;
}
/* Zon: alles wit met zwarte randen, zodat je het in fel licht nog goed ziet. */
:root[data-theme=zon] :is(.card, .isec, .sheet, .dialog) { border: 2px solid #000; }
:root[data-theme=zon] body { font-weight: 500; }
:root:is([data-theme=light], [data-theme=zon]) .scrim { background: rgba(0,0,0,.35); }
/* Vlakken in licht thema in het heldere goud; tekst in het donkerdere goud voor contrast. */
:root:is([data-theme=light], [data-theme=zon]) :is(.primary, .fab, .camfab, .mic:not(.aan), .modes button.on, .seg button.on, .pcode) { background: var(--gold); }
/* Op het donkere brons hoort witte tekst. */
:root:is([data-theme=light], [data-theme=zon]) :is(.seg button.on, .nieuwknop, .fab, .camfab, .binfo.on, .stap .nr.nu, .chip.on, .primary, .actions button.primary, .pcode, .modes button.on, .mic:not(.aan)) { color: #fff; }
:root[data-theme=light] :is(.card, .isec) { border: 1px solid #D9D2C3; box-shadow: 0 1px 2px rgba(40,30,10,.06); }
:root[data-theme=light] .lijstkop .ghost { color: var(--a2) !important; }
:root:is([data-theme=light], [data-theme=zon]) .chip.on small { color: rgba(255,255,255,.8) !important; }
header.top { position: relative; }
header.top .logo { width: 26px; height: 26px; border-radius: 6px; vertical-align: -5px; margin-right: 8px; }
.tandwiel { position: absolute; right: 8px; bottom: 8px; padding: 8px; color: var(--muted); opacity: .8; }
.tandwiel svg.i { width: 19px; height: 19px; }
.seg { display: flex; gap: 6px; margin-top: 8px; background: var(--surface-high); border-radius: 22px; padding: 4px; }
.seg button { flex: 1; padding: 9px 4px; border-radius: 18px; font-size: 14px; }
.seg button.on { background: var(--gold); color: #000; font-weight: 600; }
.maker { text-align: center; color: var(--muted); font-size: 12px; margin-top: 28px; }
[hidden] { display: none !important; }
#surf { touch-action: none; }
button, a { touch-action: manipulation; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input { font: inherit; }
#app { display: flex; flex-direction: column; height: 100%; }
header.top { flex: none; padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px; text-align: center;
  color: var(--gold); font-size: 24px; font-weight: 700; letter-spacing: 1.5px; border-bottom: 1px solid var(--gold-dark); }
main { flex: 1; overflow-y: auto; position: relative; }
/* Spraak en Rapport openen als eigen pagina binnen het project, met een terugknop. */
.pagina { position: fixed; inset: 0; background: var(--bg); z-index: 45; display: flex; flex-direction: column; }
.pagina > .pbody { flex: 1; overflow-y: auto; }
.pagina label:has(#spP), .pagina label:has(#rpP) { display: none; }
.pagina .selects { grid-template-columns: 1fr; }
.acties { display: flex; gap: 8px; padding: 10px 12px 0; }
.acties button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px; border-radius: 12px; background: var(--surface); color: var(--text); font-size: 12px; font-weight: 600; border: 1px solid transparent; }
.acties button .i { color: var(--gold); }
.acties button.aan { border-color: var(--ok); color: var(--ok); }
.acties button.aan .i { color: var(--ok); }
nav.tabs { flex: none; display: flex; background: var(--surface); border-top: 1px solid color-mix(in srgb, var(--gold) 25%, transparent); padding: 6px 8px calc(env(safe-area-inset-bottom, 0px) + 6px); }
/* Instellingen: tandwiel rechtsboven. Onderin staan Projecten en Inmeten. */
nav.tabs .ico { position: relative; }
.tbadge { position: absolute; top: -4px; right: 6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--danger); color: #fff; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; }
.inmc { display: flex; align-items: center; gap: 10px; padding: 12px 12px 12px 14px; margin-bottom: 8px; }
.inmt { flex: 1; min-width: 0; text-align: left; background: none; border: 0; color: inherit; padding: 0; }
.inmt .a { font-weight: 600; font-size: 16px; } .inmt .m { color: var(--muted); font-size: 14px; } .inmt .d { color: var(--a2); font-size: 14px; }
.inml { flex: 1; min-width: 0; }
.inmpak { background: none; border: 0; padding: 6px 0 0; color: var(--a2); font-weight: 600; font-size: 14px; }
.inmpak.mijn { color: var(--ok); }
.inmtc { flex: none; border: 1.5px solid var(--gold); color: var(--gold); background: none; border-radius: 999px; padding: 8px 12px; font-weight: 600; white-space: nowrap; }
.inmdag { display: flex; justify-content: space-between; align-items: baseline; margin: 16px 2px 8px; font-size: 16px; }
.inmdag a { color: var(--a2); font-weight: 600; text-decoration: none; }
.lijstkop { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 4px; }
.lijstkop .count { margin: 0; }
.lijstkop .ghost { white-space: nowrap; }
@media (max-width: 440px) { .lijstkop .wvbtxt { display: none; } }
.nieuwknop { display: flex; align-items: center; gap: 6px; background: var(--gold); color: #000; font-weight: 700; border-radius: 22px; padding: 9px 16px 9px 12px; font-size: 14px; }
.nieuwknop .i { width: 18px; height: 18px; }
.appstatus { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 12px; margin: 22px 4px 8px; }
.appstatus span { display: inline-flex; align-items: center; gap: 6px; }
.appstatus i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.appstatus i.ok { background: var(--ok); } .appstatus i.let { background: var(--gold); }
.rcard { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; }
.rcard .txt { flex: 1; min-width: 0; }
.rcard .a { font-weight: 600; } .rcard .m { color: var(--muted); font-size: 13px; }
.isec { background: var(--surface); border-radius: 14px; padding: 14px; margin-top: 12px; }
.isec.klap > h4:first-child { cursor: pointer; margin: 0; min-height: 28px; }
.isec.klap > h4:first-child::after { content: '▾'; margin-left: auto; font-size: 14px; transition: transform .2s; }
.isec.klap > h4.metkort::after { margin-left: 8px; }
.isec.klap.dicht > h4:first-child::after { transform: rotate(-90deg); }
.isec.klap:not(.dicht) > h4:first-child { margin-bottom: 8px; }
.isec.klap.dicht > :not(:first-child) { display: none !important; }

/* Pc en breed scherm: de knoppen in een smalle kolom rechts, zodat de foto de hele hoogte krijgt. */

  .viewer { display: grid; grid-template-columns: minmax(0, 1fr) 340px; grid-template-rows: auto minmax(0, 1fr); }

  .viewer .vbottom .status { height: auto; min-height: 36px; }
  .viewer .ondrij { flex-wrap: wrap; overflow: visible; }
}
.surface { position: absolute; }
.surface img { width: 100%; height: 100%; display: block; user-select: none; -webkit-user-drag: none; pointer-events: none; }

.navarrow { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 64px; background: rgba(0,0,0,.45); color: #fff; display: grid; place-items: center; z-index: 2; }

.vbottom { flex: none; background: var(--surface); padding: 8px 12px calc(env(safe-area-inset-bottom, 0px) + 10px); }
/* Telefoon: de foto houdt altijd minstens de helft van het scherm. Veel onderdelen = de lijst eronder schuift,

  .viewer .vbottom { max-height: 50vh; max-height: 50dvh; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 0; }

}

.status.sel { color: var(--text); justify-content: flex-start; text-align: left; }
.status.sel .st { flex: 1; }
.vspraak { position: absolute; left: 12px; right: 12px; top: 64px; z-index: 3; font-size: 13px; color: #fff; background: rgba(0,0,0,.6); border-radius: 8px; padding: 6px 10px; pointer-events: none; }
.vspraak:empty { display: none; }
.vbalk { position: absolute; left: 10px; right: 10px; top: 10px; z-index: 4; display: flex; align-items: center; gap: 8px; background: #D4AF37; color: #000; border-radius: 12px; padding: 8px 10px; box-shadow: 0 2px 10px rgba(0,0,0,.4); }
.vbalk.klaar { background: #2E7D32; color: #fff; }
.vbalk:not([hidden]) ~ .vspraak { top: 100px; }
.vbalk .vbt { flex: 1; min-width: 0; font-size: 15px; line-height: 1.25; } .vbalk .vbt small { display: block; font-size: 12px; font-weight: 400; }
.vbalk .vbk { display: flex; gap: 6px; flex: none; }
.vbalk button { background: rgba(0,0,0,.82); color: #D4AF37; border-radius: 10px; padding: 7px 10px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.vbalk.klaar button { color: #fff; background: rgba(0,0,0,.35); }
table.form { width: 100%; border-collapse: collapse; font-size: 11.5px; margin-top: 6px; }
table.form th { color: var(--gold); font-weight: 600; font-size: 10.5px; text-align: left; padding: 3px 2px; border-bottom: 1px solid var(--gold-dark); white-space: nowrap; }
table.form td { padding: 4px 2px; vertical-align: top; border-bottom: 1px dashed var(--muted); }
table.form .r { text-align: right; font-variant-numeric: tabular-nums; }
table.form td.open { color: var(--open); font-weight: 700; }
.meetstaat { padding: 10px 12px; }
.meetstaat tr:has(.tcmini) td { vertical-align: middle; } .meetstaat tr.tcactief td { background: rgba(212,175,55,.18); }
.meetstaat tr.tcgroep td { padding-top: 10px; border-top: 1px solid var(--line, #444); } .tcfotos { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 8px; } .tcfotos img { width: 72px; height: 54px; object-fit: cover; border-radius: 6px; cursor: zoom-in; flex: none; background: var(--surface-high); }
.tcscroll { overflow-x: auto; } table.tcgrid { width: 100%; border-collapse: collapse; font-size: 13px; }
table.tcgrid th { color: var(--gold); font-weight: 600; font-size: 11px; text-align: left; padding: 3px 2px; border-bottom: 1px solid var(--gold-dark); white-space: nowrap; }
table.tcgrid td { padding: 1px; border-bottom: 1px solid var(--line, #333); } table.tcgrid tr.tcactief td { background: rgba(212,175,55,.14); }
table.tcgrid input { box-sizing: border-box; min-width: 0; padding: 5px 4px; border: 1px solid transparent; border-radius: 4px; background: transparent; color: inherit; font: inherit; }
table.tcgrid input:focus { outline: none; border-color: var(--gold); background: var(--surface-high); }
.dkbadge { position: absolute; right: 2px; top: -2px; font-size: 10px; font-weight: 700; color: var(--gold); pointer-events: none; }
table.tcgrid input[data-v=b], table.tcgrid input[data-v=h], table.tcgrid input[data-v=st], table.tcgrid input[data-v=n] { text-align: right; }
table.tcgrid input[data-v=code], table.tcgrid input[data-v=type] { font-weight: 700; }
.tcweg { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 4px 6px; } .tcweg:hover { color: var(--danger); }
.tcinfo { font-size: 13px; color: var(--muted); padding: 8px 2px 0; min-height: 1.4em; }
.tclos { display: block; width: 60px; font-size: 10px; color: var(--muted); text-align: center; } .tcnieuw { margin: 8px 0 14px; padding: 8px !important; font-size: 14px; }
.tcknop { padding: 2px 8px !important; font-size: 13px; color: var(--a2); margin-left: 6px; } .tcsoort { display: block; color: var(--muted); font-size: 11px; font-weight: 400; }
.tcmini { width: 64px; padding: 4px 6px 4px 0 !important; } .tcmini img { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; display: block; background: var(--surface-high); cursor: zoom-in; }
.meetstaat .gevel { font-weight: 700; margin: 14px 0 2px; }
.meetstaat .gevel:first-child { margin-top: 0; }
.meetstaat .gevel span { color: var(--muted); font-weight: 400; margin-left: 6px; }
table.form td.oms { font-size: 11px; line-height: 1.3; }
table.form td.code { font-weight: 700; white-space: nowrap; }
table.form td[data-ncode] { cursor: pointer; text-decoration: underline dotted var(--gold-dark); text-underline-offset: 3px; }
.vspraak table.form td { border-color: rgba(255,255,255,.3); color: #fff; }
.notform { display: block; width: 100%; text-align: left; background: var(--surface); border-radius: 12px; padding: 10px 12px; margin-top: 8px; color: var(--text); }
.notform i { color: var(--muted); font-size: 12px; display: block; }
.notform b { color: var(--gold); font-size: 15px; display: block; margin-bottom: 2px; }
.nkop2 { display: flex; gap: 10px; align-items: center; }
.nfoto { width: 48px; height: 48px; object-fit: cover; border-radius: 8px; flex: none; background: var(--surface-high); }
.ldot { font-style: normal; font-size: 12px; white-space: nowrap; flex: none; margin: 0 6px; padding: 3px 9px; border-radius: 12px; border: 1px solid currentColor; }
.ldot.aan { color: var(--ok); } .ldot.bezig { color: var(--gold); animation: knipper 1s infinite; }
.status.uitleg { display: block; height: auto; min-height: 0; }
.vuitleg { background: color-mix(in srgb, var(--gold) 15%, transparent); border: 1px solid var(--gold-dark); color: var(--text); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; font-size: 14px; text-align: left; }
@keyframes knipper { 50% { opacity: .3; } }
.vmic { position: absolute; right: 16px; bottom: 16px; z-index: 3; box-shadow: 0 4px 14px rgba(0,0,0,.5); }
.schakel { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 14px; }
.schakel input { width: 20px; height: 20px; accent-color: var(--gold); }
.status.sel { height: auto; min-height: 48px; flex-direction: column; align-items: stretch; gap: 6px; }
.teller { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); padding: 0 4px; }
.status.sel .teller > span { flex: 1; }
.teller button:not(.ghost) { width: 34px; height: 34px; border-radius: 17px; background: var(--surface-high); color: var(--text); font-size: 20px; line-height: 1; }
.teller input { width: 46px; height: 34px; text-align: center; background: var(--bg); color: var(--text); border: 1px solid var(--surface-high); border-radius: 8px; font-size: 16px; }
.modes { display: flex; gap: 6px; }
.vkant { flex: none; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--gold-dark); background: none; color: var(--a2); font-size: 13px; font-weight: 600; margin-right: 6px; }
.vkant.on { background: color-mix(in srgb, var(--a2) 22%, transparent); border-color: var(--a2); }
.viewer.loc #vmodes [data-m=bekijken] { display: none; }
.kantoorknop { width: 100%; margin: 0 0 8px; padding: 10px; border-radius: 10px; border: 1px solid var(--gold-dark); background: var(--surface-high); color: var(--a2); font-weight: 600; }
.ondrij { display: flex; gap: 6px; overflow-x: auto; margin: 0 0 8px; padding-bottom: 2px; }
.ondchip { flex: none; padding: 7px 12px; border-radius: 16px; border: 1px solid var(--line, #444); background: var(--surface-high); color: inherit; font-size: 14px; white-space: nowrap; }
.ondchip b { color: var(--gold); } .ondchip.on { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 20%, transparent); } .ondchip.plus { color: var(--a2); border-style: dashed; }
.ondchip.reinig { border-color: #5AB0F0; } .ondchip.reinig b, .ondchip.plus.reinig { color: #5AB0F0; } .ondchip.reinig.on { background: color-mix(in srgb, #5AB0F0 20%, transparent); }
.kantoorknop.on { background: color-mix(in srgb, var(--a2) 18%, transparent); border-color: var(--a2); }
.modes button { flex: 1; min-width: 0; background: var(--surface-high); border-radius: 10px; padding: 5px 0 4px; display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 11px; white-space: nowrap; }
.modes button .i { width: 20px; height: 20px; }
.modes button.on { background: var(--gold); color: #000; font-weight: 600; }
/* stap 5: spraak, herkenning en lasermeter */
.selects { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field select, .field textarea { width: 100%; background: var(--surface-high); border: 1.5px solid transparent; border-radius: 10px; color: var(--text); padding: 13px 14px; outline: none; font: inherit; resize: vertical; }
.field textarea:focus, .field select:focus { border-color: var(--gold); }
.mic { width: 60px; height: 60px; border-radius: 50%; background: var(--gold); color: #000; border: 4px solid var(--gold-dark); display: grid; place-items: center; flex: none; transition: background .2s, box-shadow .2s; }
.mic.groot { width: 96px; height: 96px; }
.mic.groot svg { width: 42px; height: 42px; }
.mic.aan { background: #ff5252; color: #fff; box-shadow: 0 0 18px 4px rgba(255,82,82,.5); }
.melding { color: var(--muted); font-size: 13px; margin-top: 6px; min-height: 1em; }
.melding.fout { color: var(--danger); } .melding.ok { color: var(--ok); }
.statuslabel { border: 1px solid; border-radius: 10px; padding: 1px 8px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.statuslabel.ok { color: var(--ok); background: rgba(102,187,106,.15); }
.statuslabel.open { color: var(--open); background: rgba(255,167,38,.15); }
.statuslabel.grijs { color: var(--muted); }
.maatvakken { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
.maatvak { border: 1px solid var(--gold); background: color-mix(in srgb, var(--gold) 10%, transparent); border-radius: 10px; padding: 6px 12px; color: var(--gold); }
.maatvak.open { border-color: var(--open); background: rgba(255,167,38,.10); color: var(--open); }
.maatvak small { display: block; color: var(--muted); font-size: 11px; }
.maatvak b { font-size: 18px; font-variant-numeric: tabular-nums; }
.termrij { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; }
.termrij .tl { width: 88px; color: var(--muted); font-size: 12px; }
.term { background: var(--surface-high); border: 1px solid; border-radius: 8px; padding: 3px 10px; font-size: 13px; }
.term.onderdeel { color: var(--text); border-color: rgba(245,245,245,.5); }
.term.schade { color: #EF9A9A; border-color: rgba(239,154,154,.6); }
.term.behandeling { color: #90CAF9; border-color: rgba(144,202,249,.6); }
.nkop { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.notitie { padding: 14px; text-align: left; width: 100%; }
.outline { width: 100%; border: 1px solid; border-radius: 22px; padding: 11px; display: flex; gap: 8px; align-items: center; justify-content: center; }
.selbar { display: flex; align-items: center; gap: 4px; width: 100%; }
.maatknop { flex: 1; background: var(--select); color: #000; border-radius: 20px; padding: 10px; display: flex; gap: 6px; align-items: center; justify-content: center; font-weight: 600; }
</style>

// Foto's worden als base64-tekst (data-URL) bewaard, nooit als losse blob-link: blob-links verlopen
// zodra de pagina herlaadt en gaven zwarte foto's. Eerst in IndexedDB, met localStorage als reserve.
const memFotos = new Map(); // id -> data-URL
const FOTO_LS = 'buildcalc.foto.';
try { navigator.storage?.persist?.().catch(() => {}); } catch {}
const dbP = new Promise(res => {
  try {
    const r = indexedDB.open('buildcalc', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('fotos');
    r.onsuccess = () => res(r.result);
    r.onerror = () => res(null);
  } catch { res(null); }
});
async function idb(mode, fn) {
  const db = await dbP; if (!db) return null;
  return new Promise((res, rej) => {
    const tx = db.transaction('fotos', mode); const req = fn(tx.objectStore('fotos'));
    tx.oncomplete = () => res(req && req.result); tx.onerror = () => rej(tx.error);
  });
}
const naarDataUrl = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(blob); });

async function fotoBewaar(id, blob) {
  const data = typeof blob === 'string' ? blob : await naarDataUrl(blob);
  memZet(id, data);
  try { if (await dbP) { await idb('readwrite', s => s.put(data, id)); try { localStorage.removeItem(FOTO_LS + id); } catch {} return true; } } catch {}
  try { localStorage.setItem(FOTO_LS + id, data); return true; }
  catch { toast('Foto kon niet blijvend worden bewaard: de opslag van deze browser is vol of geblokkeerd. Maak een back-up.'); return false; }
}
async function fotoData(id) {
  if (memFotos.has(id)) return memFotos.get(id);

  try { v = await idb('readonly', s => s.get(id)); } catch {}
  // Oude opslag (blob): eenmalig omzetten naar base64.
  if (v instanceof Blob) { try { v = await naarDataUrl(v); await fotoBewaar(id, v); } catch { v = null; } }
  if (!v) try { v = localStorage.getItem(FOTO_LS + id); } catch {}

}
async function fotoLaad(id) { const d = await fotoData(id); return d ? dataUrlNaarBlob(d) : null; }

const fotoUrl = fotoData;
// Zuinig met batterij en geheugen: hooguit 20 grote foto's tegelijk in het geheugen (de laatst bekeken).
function memZet(id, v) { memFotos.delete(id); memFotos.set(id, v); while (memFotos.size > 20) memFotos.delete(memFotos.keys().next().value); }
// Kleine fotootjes voor lijsten (langste zijde 400 px): veel lichter dan steeds de grote foto te laden en te verkleinen.
// Ze worden één keer gemaakt en bewaard; daarna laden lijsten meteen.
const memMini = new Map();
async function fotoMini(id) {
  if (memMini.has(id)) return memMini.get(id);
  let v = null; try { v = await idb('readonly', s => s.get('mini:' + id)); } catch {}
  if (typeof v !== 'string') {
    const groot = await fotoData(id); if (!groot) return null;
    try {
      const bb = await verkleindBeeld(dataUrlNaarBlob(groot), 400), c = document.createElement('canvas'); c.width = bb.w; c.height = bb.h;
      c.getContext('2d').drawImage(bb.bron, 0, 0, bb.w, bb.h); bb.klaar(); v = c.toDataURL('image/jpeg', 0.75); c.width = c.height = 0;
      try { await idb('readwrite', s => s.put(v, 'mini:' + id)); } catch {}
    } catch { v = groot; }
    memFotos.delete(id); // de grote alleen bewaren als je hem echt bekijkt
  }
  memMini.set(id, v); if (memMini.size > 400) memMini.delete(memMini.keys().next().value);

}
// Bij het starten oude foto's (als blob opgeslagen) eenmalig omzetten, zonder ze allemaal in het geheugen te laden.
setTimeout(async () => {
  try { if (localStorage.getItem('bc_fotomig2')) return; } catch {}
  for (const p of projecten) for (const s of p.submappen) for (const f of s.fotos) {

  }

// ---------- back-upherinnering ----------
// Een back-up in de app zelf ben je kwijt als de telefoon stukgaat. Daarom: heb je meetwerk dat nog niet buiten de
// telefoon staat (Back-up naar Google Drive), dan vraagt de lijst er na een paar dagen om. Eén tik, en Later = morgen weer.
const WIJZIG_KEY = 'buildcalc.gewijzigdOp', BUITEN_KEY = 'buildcalc.backupBuiten', SLUIMER_KEY = 'buildcalc.backupLater', BACKUP_DAGEN = 3;
const leesGetal = k => { try { return +localStorage.getItem(k) || 0; } catch { return 0; } };
const backupBuitenGedaan = () => { try { localStorage.setItem(BUITEN_KEY, String(Date.now())); } catch {} };
function backupHerinnering() {
  if (!projecten.length) return '';
  const buiten = leesGetal(BUITEN_KEY), wijzig = leesGetal(WIJZIG_KEY), dag = 864e5;
  if (wijzig && wijzig <= buiten) return '';
  if (buiten && Date.now() - buiten < BACKUP_DAGEN * dag) return '';
  if (Date.now() - leesGetal(SLUIMER_KEY) < dag / 2) return '';
  const dagen = buiten ? Math.floor((Date.now() - buiten) / dag) : null;
  // Klein balkje van één regel: tik op Back-up, of × om het een halve dag weg te zetten.
  return `<div class="card" id="bkHerinner" style="margin:4px 16px 8px;padding:6px 6px 6px 12px;border:1px solid var(--gold);display:flex;align-items:center;gap:8px;font-size:13px">
    <span style="flex:1;min-width:0">${ic('opslaan')} ${dagen == null ? 'Nog geen back-up' : `Back-up ${dagen === 1 ? '1 dag' : dagen + ' dagen'} oud`}</span>
    <button class="primary" id="bkNu" style="flex:none;width:auto;padding:6px 12px;min-height:0;font-size:13px">Back-up</button><button class="ghost" id="bkLater" aria-label="Later" style="flex:none;width:auto;padding:4px 8px;min-height:0">×</button></div>`;
}
function koppelHerinnering(m) {
  if ($('#bkNu', m)) $('#bkNu', m).onclick = () => backupNaarDrive();
  if ($('#bkLater', m)) $('#bkLater', m).onclick = () => { try { localStorage.setItem(SLUIMER_KEY, String(Date.now())); } catch {} $('#bkHerinner', m)?.remove(); };
}

  const bestand = new File([blob], naam, { type: 'application/zip' });

    try { await navigator.share({ files: [bestand], title: titel }); return true; }
    catch (e) { if (e?.name === 'AbortError') return false; }
  }
  await download(blob, naam);
  await new Promise(klaar => { const s = sheet(`<h2>Zip naar Google Drive</h2>
      <div style="color:var(--muted);font-size:13px;margin-bottom:12px">De zip staat in je map Downloads. Open Drive, kies + (Nieuw) en dan Uploaden, en kies de zip uit Downloads.</div>
      <a class="primary" href="https://drive.google.com/drive/my-drive" target="_blank" rel="noopener" style="display:flex;gap:8px;align-items:center;justify-content:center;text-decoration:none">${ic('opslaan')} Google Drive openen</a>
      <button class="ghost" id="zdSluit" style="width:100%;margin-top:8px">Klaar</button>`);
    $('#zdSluit', s).onclick = () => { sluit(s); klaar(); };
    s.querySelector('a').addEventListener('click', () => setTimeout(() => { sluit(s); klaar(); }, 300)); });
  return true;
}

async function fotoBestanden(p, voor = '') {
  // Drie foto's tegelijk (net als het rapport), en de foto zelf rechtstreeks uit de opslag omzetten: dat scheelt veel tijd.
  // De versie met maten op 2000 px: scherp genoeg voor de projectmap, en veel sneller dan 2400 op de telefoon.
  const alle = p.submappen.flatMap((s, mi) => s.fotos.map((f, fi) => ({ s, mi, f, fi })));
  const schoon = schoonNaam, per = new Array(alle.length); let i = 0, n = 0;
  const een = async x => {
    const d = await fotoData(x.f.id); if (!d) return [];
    const bytes = new Uint8Array(await (await fetch(d)).arrayBuffer()), ext = d.startsWith('data:image/png') ? 'png' : 'jpg';
    const vn = schoon(volNaam(p, x.s)), map = `${String(x.mi + 1).padStart(2, '0')} ${vn}`, basis = `${voor}${map}/${vn} ${String(x.fi + 1).padStart(2, '0')}`;
    const uit = [[`${basis}.${ext}`, bytes]];
    // Heeft de foto maten of opmerkingen, dan komt er ook een versie mét de maten erop bij.
    if (x.f.lijnen?.length || x.f.opmerkingen?.length || x.f.labels?.length) try {
      const m = await fotoMetLijnen(x.f, 2000); if (m) uit.push([`${basis} met maten.jpg`, m.jpeg]);
      for (const k of PDF_BEELD.keys()) if (k.startsWith(x.f.id + '|') && k.includes(',2000,')) PDF_BEELD.delete(k);
    } catch (e) { console.warn(e); }
    return uit;
  };
  const werker = async () => { while (i < alle.length) { const k = i++;
    try { per[k] = await een(alle[k]); } catch (e) { console.warn(e); per[k] = []; }
    toast(`Foto's verzamelen… ${++n} van ${alle.length}`); } };
  await Promise.all([werker(), werker(), werker()]);
  return per.flat();
}

// De lijst uit Excel (straat, huisnummer, woningtype) plak je in het project. De app telt per woningtype hoeveel
// woningen het zijn en welke huisnummers: dat aantal is de factor die je zelf in Topcalc invult. De app vermenigvuldigt niets.
function leesAdressen(tekst) {

  // Woningtype netjes: "TUSSENWONING", "tussenwoning" en "Tussenwoning " worden allemaal "Tussenwoning".
  const typeNet = t => { t = String(t || '').trim().replace(/\s+/g, ' '); return t ? t[0].toUpperCase() + t.slice(1).toLowerCase() : ''; };
  const voegToe = (straat, nr, toev, type, bron) => { straat = String(straat || '').trim().replace(/\s+/g, ' '); nr = (String(nr || '').trim() + String(toev || '').trim()).replace(/\s+/g, '');
    if (!straat || !/^\d/.test(nr)) { over.push(bron); return; } const k = (straat + '|' + nr).toLowerCase(); if (gezien.has(k)) return; gezien.add(k);
    type = typeNet(type); uit.push({ id: nieuwId(), straat, nr, ...(type ? { type } : {}) }); };
  // Eén adres in één stuk tekst: "Potgieterstraat 3", "Potgieterstraat 3a", "Potgieterstraat 3 A", "Potgieterstraat 7-2", met eventueel het type erachter.
  const ADRES = /^(.*?\D)\s+(\d{1,5})((?:-\d{1,3}|-?[a-zA-Z]{1,2})(?![a-zA-Z0-9]))?(?:\s+(hs|[a-zA-Z])(?![a-zA-Z0-9]))?[\s,;:-]*(.*)$/;
  const splits = t => { const m = ADRES.exec(String(t || '').trim()); return m && /[a-z]/i.test(m[1]) ? { straat: m[1], nr: m[2], toev: (m[3] || '').replace(/^-(?=[a-z])/i, '') + (m[4] || ''), rest: m[5] } : null; };
  if (!scheid) { for (const r of rijen) { const a = splits(r); a ? voegToe(a.straat, a.nr, a.toev, a.rest, r) : over.push(r); } return uit; }
  const cel = rijen.map(r => r.split(scheid).map(c => c.trim())), kop = cel[0].map(c => c.toLowerCase());
  const isPc = c => /^\d{4}\s?[a-z]{2}$/i.test(c), isNr = c => /^\d{1,5}(?:\s?[-/]?\s?[a-z0-9]{1,3})?$/i.test(c) && !isPc(c);
  let kol = null, adresKol = -1;
  if (kop.some(c => /^(straat|straatnaam|adres|huisn)/.test(c)) && !kop.some(c => /^\d+$/.test(c))) { const zoek = re => kop.findIndex(c => re.test(c));
    kol = { straat: zoek(/straat|^adres/), nr: zoek(/huisn|^nr\.?$|^nummer/), toev: zoek(/toev/), type: zoek(/type|soort/) }; cel.shift();
    // Geen eigen kolom voor het huisnummer: dan staat het in de adreskolom ("Potgieterstraat 3").
    if (kol.nr < 0 && kol.straat >= 0) { adresKol = kol.straat; kol = { ...kol, straat: -1 }; } }
  else { // geen kopregel: het huisnummer is de kolom met kleine getallen (eventueel met letter) direct na een kolom met tekst
    const breed = Math.max(...cel.map(r => r.length)), deel = (i, test) => cel.filter(r => test(r[i] || '')).length / cel.length;
    const tekstKol = i => deel(i, c => !c || (/[a-z]/i.test(c) && !/^\d/.test(c))) > .8;
    const nr = [...Array(breed).keys()].find(i => i > 0 && deel(i, isNr) > .8 && tekstKol(i - 1));
    const pc = [...Array(breed).keys()].find(i => deel(i, isPc) > .8);
    if (nr == null) { // misschien staat straat en huisnummer samen in één kolom
      adresKol = [...Array(breed).keys()].find(i => deel(i, c => !!splits(c) && !isPc(c)) > .8) ?? -1;
      if (adresKol < 0) { over.push(...rijen); return uit; }
      const laatste = breed - 1, type = laatste > adresKol && laatste !== pc && deel(laatste, c => /[a-z]/i.test(c) && !splits(c)) > .8 ? laatste : -1;
      kol = { straat: -1, nr: -1, toev: -1, type }; }
    else { const toev = nr + 1 < breed && nr + 1 !== pc && deel(nr + 1, c => c.length <= 4 && !/^\d{4}/.test(c)) > .95 ? nr + 1 : -1;
      const laatste = breed - 1, type = laatste > nr && laatste !== pc && laatste !== toev && deel(laatste, c => /[a-z]/i.test(c)) > .8 ? laatste : -1;

  if (adresKol < 0 && (kol.straat < 0 || kol.nr < 0)) { over.push(...rijen); return uit; }

  let vorige = '';
  for (const [i, r] of cel.entries()) { const bron = rijen[i + (cel.length < rijen.length ? 1 : 0)] || r.join(' ');
    const type = kol.type >= 0 ? r[kol.type] : '';
    if (adresKol >= 0) { const a = splits(r[adresKol]); if (!a) { over.push(bron); continue; } voegToe(a.straat, a.nr, a.toev, type || a.rest, bron); vorige = a.straat; continue; }
    const straat = r[kol.straat] || vorige; if (r[kol.straat]) vorige = r[kol.straat];
    voegToe(straat, r[kol.nr], kol.toev >= 0 ? r[kol.toev] : '', type, bron); }
  return uit;
}

// ---------- stappenplan: een klus stap voor stap, zodat je niets vergeet ----------
// Nieuw project: adressen (BAG) → woningtypen en trappenhuizen → algemeen werk → stappenplan.
// Elke stap heeft eigen mappen (per gevel), dus foto's, lijnen, inspreken en de meetstaat werken zoals altijd.
const CONTROLE = [
  { k: 'scheur', n: 'Scheuren in metselwerk', opties: ['Nee', 'Ja'], slecht: ['Ja'], foto: ['Ja'] },
  { k: 'glas', n: 'Beglazing', opties: ['Enkel', 'Oud dubbel', 'Nieuw dubbel / HR++'], slecht: [], foto: [] },
  { k: 'rot', n: 'Houtrot', opties: ['Geen', 'Licht', 'Veel'], slecht: ['Licht', 'Veel'], foto: ['Veel'] },
  { k: 'hwa', n: 'Hemelwaterafvoer', opties: ['In orde', 'Lekt / los', 'Ontbreekt'], slecht: ['Lekt / los', 'Ontbreekt'], foto: [] },
  { k: 'voeg', n: 'Voegwerk', opties: ['Goed', 'Matig', 'Slecht'], slecht: ['Matig', 'Slecht'], foto: [] },
];
// Algemeen werk in jouw volgorde. "teller": meet er één in, × het aantal. "kaart": meten op de kaart met de gebouwvorm uit de BAG.
const ALGEMEEN = [
  { n: 'Balkonplafonds', teller: 'balkons' }, { n: 'Hekwerk galerij', kaart: true, teller: 'galerijen' }, { n: 'Balkonhekken', teller: 'balkons' },
  { n: 'Daklijsten', kaart: true }, { n: 'Algemene deuren box en schuur', teller: 'deuren' }, { n: 'Algemene ingang' }, { n: 'Dakgoten', kaart: true },
  { n: 'Boeidelen', uit: true }, { n: 'Liftdeuren', teller: 'deuren', uit: true }, { n: 'Brievenbussen', teller: 'stuks', uit: true },
];
const FLATWERK = ['Balkonplafonds', 'Hekwerk galerij', 'Balkonhekken', 'Algemene deuren box en schuur', 'Algemene ingang'];
const nieuwPlan = p => ({ fase: p.bag ? 'typen' : 'bag', stappen: [] });
// Woningtypen: uit de BAG, of zelf ingevuld ("Zonder BAG").
function planTypen(p) {
  if (p.bag?.woningen?.length) return bagTypen(p).map(t => {
    const w = [...t.woningen].sort((a, b) => a.straat.localeCompare(b.straat) || a.nr - b.nr)[0];
    return { id: t.id, naam: t.naam, aantal: t.aantal, keer: { type: t.id }, m2: t.m2, nrs: nummerReeks(t.woningen), info: `${t.m2} • nrs ${nummerReeks(t.woningen)}`, voorbeeld: w ? `${w.straat} ${bagNummer(w)}` : '' };
  });
  return (p.plan?.hand || []).map(t => ({ id: t.id, naam: t.naam || `Type ${t.id}`, aantal: t.aantal, keer: t.aantal > 1 ? { n: t.aantal } : null, info: '', voorbeeld: '' }));
}
const planWoningen = p => planTypen(p).reduce((a, t) => a + t.aantal, 0);
const stapSubs = (p, st) => st.subs.map(id => p.submappen.find(s => s.id === id)).filter(Boolean);
const stapKeer = (p, st) => { const s = stapSubs(p, st)[0]; return s ? keerVan(p, s) : 1; };
const zetKeer = (s, keer) => { if (keer && (keer.type || keer.n > 1)) s.keer = keer; else delete s.keer; };
function standaardAantal(p, teller) {
  if (teller === 'galerijen') return Math.max(1, ...(p.bag?.gebouwen || []).map(g => (g.lagen || 2) - 1));
  if (teller === 'deuren') return 1; // gezamenlijke deuren (bergingen, lift): niet per woning, zelf invullen
  return Math.max(1, planWoningen(p));
}
// Oudere plannen gaven deuren standaard het aantal woningen mee. Staat het daar nog op, dan terug naar 1 (één keer).
function deurenHerstel(p) {
  let anders = false;
  for (const st of p.plan?.stappen || []) {
    if (st.teller !== 'deuren' || st.deurHerstel) continue;
    st.deurHerstel = true; anders = true;
    if (st.naam === 'Box- en schuurdeuren') {
      const nw = 'Algemene deuren box en schuur', al = p.plan.algemeen?.find(x => x.n === st.naam);
      if (al) al.n = nw; stapSubs(p, st).forEach(x => { if (x.naam === st.naam) x.naam = nw; }); st.naam = nw; st.sleutel = 'a:' + nw.toLowerCase();
    }
    const n = planWoningen(p); for (const s of stapSubs(p, st)) if (n > 1 && s.keer?.n === n) zetKeer(s, { n: 1 });
  }
  return anders;
}
// Maakt of werkt het stappenplan bij. Bestaande stappen en hun mappen blijven bewaard; niets wordt verwijderd.
function maakStappen(p) {
  const pl = p.plan, oud = new Map((pl.stappen || []).map(s => [s.sleutel, s])), uit = [];
  const sub = (naam, keer, st) => {
    let s = p.submappen.find(x => x.naam.toLowerCase() === naam.toLowerCase());
    if (!s) { s = { id: nieuwId(), naam, aangemaakt: new Date().toISOString(), fotos: [], notities: [] }; p.submappen.push(s); }
    zetKeer(s, keer); s.stapId = st.id; return s.id;
  };
  const stap = (sleutel, soort, naam, extra = {}) => {
    const st = oud.get(sleutel) || { id: nieuwId(), sleutel, soort, naam, klaar: false, overgeslagen: false, controle: {}, nrs: {}, subs: [] };
    Object.assign(st, extra); st.subs = st.subs.filter(id => p.submappen.some(s => s.id === id)); uit.push(st); return st;
  };
  for (const t of planTypen(p)) {
    const st = stap('w:' + t.id, 'woning', `Woning ${t.naam}`, { type: t.id });
    if (!st.subs.length) st.subs = ['Voorgevel', 'Achtergevel'].map(g => sub(`${t.naam} – ${g}`, t.keer, st));
    else stapSubs(p, st).forEach(s => zetKeer(s, t.keer));
  }
  const tn = pl.trap?.n || 0, gelijk = pl.trap?.gelijk !== false || tn < 2;
  for (const i of tn ? (gelijk ? [0] : Array.from({ length: tn }, (_, i) => i + 1)) : []) {
    const naam = i ? `Trappenhuis ${i}` : 'Trappenhuis', keer = i ? null : { n: tn }, st = stap('t:' + i, 'trap', naam);
    if (!st.subs.length) st.subs = ['Buitenkant', 'Binnenkant'].map(g => sub(`${naam} – ${g}`, keer, st));
    else stapSubs(p, st).forEach(s => zetKeer(s, keer));
  }
  for (const a of (pl.algemeen || []).filter(a => a.on)) {
    const st = stap('a:' + a.n.toLowerCase(), 'algemeen', a.n, { teller: a.teller || null, kaart: !!a.kaart });
    if (!st.subs.length) st.subs = [sub(a.n, a.teller ? { n: standaardAantal(p, a.teller) } : null, st)];
  }

}
// Nieuw type afgesplitst of BAG opnieuw opgehaald: dan klopt het plan niet meer met de typen.

// ----- het stappenplan in het project -----
function planKaartHtml(p) {
  if (!p.plan) return `<button class="card planleeg" id="planNieuw"><span style="color:var(--gold)">${ic('folderPlus')}</span>
    <span><b>Stappenplan maken</b><small>Adressen, woningtypen, trappenhuizen en algemeen werk stap voor stap, met controlelijst.</small></span>${ic('right')}</button>`;
  const st = p.plan.stappen, k = st.filter(s => s.klaar).length, v = st.findIndex(s => !s.klaar && !s.overgeslagen);
  // Kort: de eerste 5 stappen (plus de stap die nu aan de beurt is); de rest achter "nog n stappen".
  const volg = ['woning', 'trap', 'algemeen'].flatMap(so => st.map((s, i) => [s, i]).filter(([s]) => s.soort === so));
  const kort = !VAK_OPEN.has('plan') && volg.length > 6, zien = new Set(volg.filter(([s, i], j) => !kort || j < 5 || i === v).map(([s]) => s));
  const groep = (soort, titel) => { const r = volg.filter(([s]) => s.soort === soort && zien.has(s));
    return r.length ? `<div class="label">${titel}</div>` + r.map(([s, i]) => stapRij(p, s, i, v)).join('') : ''; };
  return `<div class="card plan"><div class="pkop"><div><b>Stappenplan</b><small>${k} van ${st.length} stappen klaar${st.some(s => s.overgeslagen) ? ` • ${st.filter(s => s.overgeslagen).length} overgeslagen` : ''}</small></div>
      <button class="iconbtn" id="planMenu" aria-label="Opties stappenplan">${ic('more')}</button></div>
    <div class="bar"><i style="width:${st.length ? Math.round(100 * k / st.length) : 0}%"></i></div>
    ${groep('woning', 'WONINGEN (ÉÉN PER TYPE)')}${groep('trap', 'TRAPPENHUIZEN')}${groep('algemeen', 'ALGEMEEN')}
    ${volg.length > 6 ? `<button class="wzlink stil" data-vak="plan" style="width:100%">${kort ? `nog ${volg.length - zien.size} ${volg.length - zien.size === 1 ? 'stap' : 'stappen'} ▾` : 'minder tonen ▴'}</button>` : ''}
    ${v < 0 ? `<div class="pklaar">${st.length ? 'Alle stappen zijn klaar of overgeslagen.' : 'Nog geen stappen.'}</div>` : ''}
    ${(() => { const n = eindPunten(p).length; return `<button class="wzlink" id="naarEind" style="width:100%">Eindcontrole${n ? ` (${n} open)` : ' ✓'}</button>`; })()}</div>`;
}
// ----- werkwijze: de 5 stappen van een klus en één knop met wat er nu moet gebeuren -----
// 1 Adressen (BAG of eigen typen) • 2 Opnemen (stappenplan) • 3 Kantoor (heen en terug) • 4 Controle (eindcontrole) • 5 Rapport.
const WERK = ['Adressen', 'Opnemen', 'Kantoor', 'Controle', 'Rapport'];
function werkStand(p) {
  const st = p.plan?.stappen || [], v = st.findIndex(s => !s.klaar && !s.overgeslagen), open = eindPunten(p).length;
  const klaar = [!!p.plan && !p.plan.fase, !!p.plan && st.length > 0 && v < 0, !!p.verstuurdNaar || !Native || !!p.kantoorOver, open === 0, !!p.verstuurd];
  klaar[2] &&= klaar[1]; klaar[3] &&= klaar[2]; // op volgorde: kantoor en controle tellen pas na het opnemen
  const nu = klaar.findIndex(x => !x);
  let knop;
  if (!p.plan) knop = { t: 'Begin: adressen en stappenplan', a: 'plan' };
  else if (v >= 0) knop = { t: `Verder met stap ${v + 1}: ${st[v].naam}`, k: `${st.filter(s => s.klaar).length} van ${st.length} stappen klaar`, a: 'stap', id: st[v].id };
  else if (!klaar[2]) knop = { t: 'Naar kantoor sturen', k: 'Alle stappen zijn klaar. Stuur het project naar de pc om het af te maken.', a: 'kantoor', over: true };
  else if (open) knop = { t: `Eindcontrole: ${open} ${open === 1 ? 'punt' : 'punten'} open`, k: 'Los ze op of maak het rapport toch.', a: 'eind' };
  else if (!p.verstuurd) knop = { t: 'Maak het rapport', k: 'Alles is compleet.', a: 'rapport' };
  else knop = { t: 'Rapport opnieuw bekijken', k: `Verstuurd op ${datumNL(new Date(p.verstuurd))}`, a: 'rapport' };
  return { klaar, nu: nu < 0 ? 5 : nu, knop };
}
function werkwijzeHtml(p) {
  const { klaar, nu, knop } = werkStand(p);
  return `<div class="card werk"><div class="wbar">${WERK.map((n, i) => `<i class="${klaar[i] ? 'ok' : i === nu ? 'nu' : ''}"></i>`).join('')}</div>
    <div class="wlbl">${WERK.map((n, i) => `<span class="${klaar[i] ? 'ok' : i === nu ? 'nu' : ''}">${n}${klaar[i] ? ' ✓' : ''}</span>`).join('')}</div>
    <button class="primary" id="werkKnop">${esc(knop.t)}</button>${knop.k ? `<div class="wk">${esc(knop.k)}</div>` : ''}
    ${knop.over ? `<button class="wzlink" id="werkOver" style="width:100%">Niet nodig, ik maak het op dit toestel af</button>` : ''}</div>`;
}
function koppelWerkwijze(m, p) {
  const b = $('#werkKnop', m); if (!b) return;
  const { knop } = werkStand(p);
  b.onclick = () => {
    if (knop.a === 'plan') { p.plan = nieuwPlan(p); bewaar(); render(); }
    else if (knop.a === 'stap') { stapel = [p.id, 'stap:' + knop.id]; render(); }
    else if (knop.a === 'kantoor') projectVersturen(p).then(() => render());
    else if (knop.a === 'eind') { stapel = [p.id, 'eind']; render(); }
    else openPagina('rapport', p);
  };
  const o = $('#werkOver', m); if (o) o.onclick = () => { p.kantoorOver = true; bewaar(); render(); };
}
// Eindcontrole vóór het rapport: staat er nog iets open, dan eerst laten zien wat. Geeft true als het rapport gemaakt mag worden.
function eerstControle(p) {
  const punten = eindPunten(p); if (!punten.length) return Promise.resolve(true);
  return new Promise(res => {
    const d = dialoog(`<h2>Bijna klaar</h2><div style="color:var(--muted)">Er ${punten.length === 1 ? 'mist nog 1 ding' : `missen nog ${punten.length} dingen`} in het rapport:</div>
      <div style="margin-top:10px;font-size:14px">${punten.slice(0, 5).map(x => `<div style="padding:4px 0;display:flex;gap:8px"><span style="color:var(--open)">●</span><span>${esc(x.t)}</span></div>`).join('')}
      ${punten.length > 5 ? `<div style="color:var(--muted);padding:4px 0">en nog ${punten.length - 5} meer</div>` : ''}</div>
      <div class="actions"><button id="ecToch">Toch maken</button><button id="ecLos" class="primary">Eerst oplossen</button></div>`, () => res(false));
    $('#ecToch', d).onclick = () => { sluit(d); res(true); };
    $('#ecLos', d).onclick = () => { sluit(d); res(false); sluitPagina(false); tab = 'projecten'; stapel = [p.id, 'eind']; render(); };
  });
}
function stapRij(p, s, i, v) {
  const subs = stapSubs(p, s), fotos = subs.reduce((a, x) => a + x.fotos.length, 0), noti = subs.reduce((a, x) => a + x.notities.length, 0), keer = stapKeer(p, s);
  const info = [s.soort !== 'algemeen' ? `controle ${CONTROLE.filter(c => s.controle[c.k]).length}/${CONTROLE.length}` : '',
    `${fotos} ${fotos === 1 ? 'foto' : "foto's"}`, noti ? `${noti} ${noti === 1 ? 'notitie' : 'notities'}` : '', s.overgeslagen ? 'overgeslagen' : ''].filter(Boolean).join(' • ');
  return `<button class="stap" data-stap="${s.id}"><span class="nr ${s.klaar ? 'ok' : s.overgeslagen ? 'skip' : i === v ? 'nu' : ''}">${s.klaar ? '✓' : i + 1}</span>
    <span class="t"><b>${esc(s.naam)}</b><small>${esc(info)}</small></span>${keer > 1 ? `<span class="x">${keer}×</span>` : ''}</button>`;
}
function koppelPlanKaart(m, p) {
  const n = $('#planNieuw', m); if (n) n.onclick = () => { p.plan = nieuwPlan(p); bewaar(); render(); };
  const e = $('#naarEind', m); if (e) e.onclick = () => { stapel = [p.id, 'eind']; render(); };

  const mn = $('#planMenu', m);
  if (mn) mn.onclick = () => menu([
    ['edit', 'Stappenplan aanpassen (typen, trappenhuizen, algemeen werk)', () => { p.plan.fase = 'typen'; bewaar(); render(); }],
    ['trash', 'Stappenplan weghalen', async () => {
      if (!await bevestig('Stappenplan weghalen?', 'Alleen het plan en de controlelijst verdwijnen. Mappen, foto\'s en notities blijven bewaard.', { ja: 'Weghalen' })) return;

      ${st.teller ? `<div class="card ctl"><b>Hoeveel ${esc(st.teller)} ${st.teller === 'galerijen' ? 'zijn er' : 'van deze maat'}?</b>
        <div class="wzuitleg">${st.teller === 'galerijen' ? 'Meet één galerij; de meetstaat telt hem × het aantal galerijen.' : 'Meet er één in; de meetstaat telt deze stap × het aantal. Een andere maat? Maak er met "Stappenplan aanpassen" een eigen stap van.'}</div>

        <small>${s.fotos.length || s.notities.length ? [s.fotos.length ? `${s.fotos.length} ${s.fotos.length === 1 ? 'foto' : "foto's"}` : '', s.notities.length ? `${s.notities.length} ${s.notities.length === 1 ? 'notitie' : 'notities'}` : ''].filter(Boolean).join(' • ') : 'nog niets'}</small></span>

// Maakt grote camerafoto's kleiner, zodat ze snel laden en weinig ruimte innemen.
// Foto's kleiner opslaan: langste zijde 2000 px, JPEG 80%. Lijnen staan in verhoudingen (0-1) en blijven dus kloppen.
const FOTO_MAX = 2000, FOTO_KWALITEIT = 0.8;
// Brandpuntsafstand (35 mm-equivalent) uit de EXIF van de camerafoto; nodig om de foto recht te rekenen.
async function jpegF35(blob) {

      const zoek = (ifd, tag) => { const n = u16(ifd); for (let k = 0; k < n; k++) { const e = ifd + 2 + k * 12; if (u16(e) === tag) return e; } return null; };
      const ex = zoek(u32(4), 0x8769); if (ex == null) return null;
      const e = zoek(u32(ex + 8), 0xA405); const v = e != null ? u16(e + 8) : 0;
      return v >= 10 && v <= 300 ? v : null;
    }

    i += 2 + len;
  }

}
// Breedte en hoogte uit de kop van een JPEG, zonder de foto te decoderen.
async function jpegMaat(blob) {
  const b = new Uint8Array(await blob.slice(0, 262144).arrayBuffer());
  if (b[0] !== 0xFF || b[1] !== 0xD8) return null;
  for (let i = 2; i + 9 < b.length;) {

    if (m >= 0xC0 && m <= 0xCF && m !== 0xC4 && m !== 0xC8 && m !== 0xCC) return [(b[i + 7] << 8) | b[i + 8], (b[i + 5] << 8) | b[i + 6]];

}

const isGroteFoto = async b => { const m = await jpegMaat(b); return m ? Math.max(...m) > FOTO_MAX : b.size > 1572864; };

async function jpegDraai(blob) {
  const b = new Uint8Array(await blob.slice(0, 131072).arrayBuffer());
  if (b[0] !== 0xFF || b[1] !== 0xD8) return 1;
  for (let i = 2; i + 4 < b.length;) {

    const m = b[i + 1], len = (b[i + 2] << 8) | b[i + 3];

      for (let k = 0; k < n; k++) { const e = ifd + 2 + k * 12; if (u16(e) === 0x0112) return u16(e + 8) || 1; }

    }

}
// Een (bijna) helemaal zwarte afbeelding: zo eindigt verkleinen als de telefoon te weinig geheugen had.
function isZwart(c) {
  const g = c.getContext('2d'), s = 12, d = g.getImageData(0, 0, c.width, c.height).data;
  let max = 0;
  for (let y = 0; y < s; y++) for (let x = 0; x < s; x++) {
    const p = (Math.floor((y + .5) * c.height / s) * c.width + Math.floor((x + .5) * c.width / s)) * 4;
    max = Math.max(max, d[p], d[p + 1], d[p + 2]);
  }

}
// Verkleinen naar max px. Grote camerafoto's (50 MP en meer) worden direct verkleind ingelezen
// (createImageBitmap), anders raakt het geheugen van een telefoon op en wordt de foto zwart.
// Is het resultaat toch zwart, dan bewaren we het origineel.
async function verklein(file, max, kwaliteit = FOTO_KWALITEIT) {
  const c = document.createElement('canvas'), g = c.getContext('2d');
  let gelukt = false;
  const maat = await jpegMaat(file).catch(() => null);
  if (maat && window.createImageBitmap) try {
    const k = Math.min(1, max / Math.max(...maat)), staand = (await jpegDraai(file)) >= 5;
    const [w, h] = staand ? [maat[1], maat[0]] : maat;
    const bm = await createImageBitmap(file, { resizeWidth: Math.round(w * k), resizeHeight: Math.round(h * k), resizeQuality: 'high', imageOrientation: 'from-image' });

    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      g.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res();
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('geen geldige afbeelding')); };
    img.src = url;
  });

    return new Blob([await file.arrayBuffer()], { type: file.type || 'image/jpeg' });
  }
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('kon foto niet omzetten')), 'image/jpeg', kwaliteit));
}

// Spraak via de spraakherkenning van Android.
// Let op: Android meldt "gestopt" (einde spraak) vóórdat de definitieve, nauwkeurigste tekst binnenkomt.
// Daarom wachten we na "gestopt" nog even op die laatste uitslag en ruimen pas daarna de luisteraars op.
const NativeSpraak = {
  laatste: '', lijst: [], klaar: null, wacht: null, stil: null,
  async start(spraak, onTekst) {
    const sr = plugin('SpeechRecognition');
    const { available } = await sr.available().catch(() => ({ available: false }));
    if (!available) throw new Error('Op deze telefoon is geen spraakherkenning beschikbaar.');
    const r = await sr.requestPermissions().catch(() => null);
    if (r && r.speechRecognition && r.speechRecognition !== 'granted') throw new Error('Geef BuildCalc toestemming voor de microfoon in de instellingen van Android.');

    const afronden = () => {
      if (!this.klaar) return;
      const f = this.klaar; this.klaar = null; clearTimeout(this.wacht); clearTimeout(this.stil);
      if (!this.laatste) spraak.fout = 'Ik heb niets verstaan. Tik op de microfoon en spreek rustig, dicht bij de telefoon.';
      spraak.aan = false; spraak.melden();
      if (this.laatste) onTekst(this.laatste, true);
      this.stopLuisteren(); f();
    };
    this.klaar = () => {};
    // Veiligheid: komt er na 15 s niets meer binnen (fout of stilte), dan netjes stoppen.
    const bewaak = () => { clearTimeout(this.stil); this.stil = setTimeout(afronden, 15000); };
    this.lijst.push(await sr.addListener('partialResults', d => {
      const t = (d.matches?.[0] || '').trim(); bewaak();
      if (t) this.laatste = t;
      if (gestopt) return afronden(); // dit is de definitieve uitslag
      if (t) onTekst(t, false);
    }));
    this.lijst.push(await sr.addListener('listeningState', d => {
      if (d.status !== 'stopped' || gestopt) return;
      gestopt = true; clearTimeout(this.wacht); this.wacht = setTimeout(afronden, 2000);
    }));
    spraak.aan = true; spraak.melden(); bewaak();

  },
  async stopLuisteren() { const l = this.lijst; this.lijst = []; for (const x of l) try { await x.remove(); } catch {} },
  // Handmatig stoppen: Android geeft daarna nog de definitieve tekst, die nemen we mee.
  stop() {
    try { plugin('SpeechRecognition')?.stop()?.catch?.(() => {}); } catch {}
    if (this.klaar) { clearTimeout(this.wacht); this.wacht = setTimeout(() => this.afronden?.(), 1500); }
  },
};

// Bestanden: opslaan in de app en aanbieden via het deelmenu van Android (mail, Drive, WhatsApp).
async function nativeBewaar(blob, naam, { stil = false } = {}) {
  const fs = plugin('Filesystem'), data = await naarBase64(blob);
  if (stil) { await appBackupBewaar(naam, data); return; }
  const { uri } = await fs.writeFile({ path: naam, data, directory: 'CACHE' });
  await plugin('Share').share({ title: naam, files: [uri], dialogTitle: 'Waar wil je het opslaan? Kies Drive' }).catch(e => { if (!/cancel/i.test(e?.message || '')) throw e; });
}

// Back-ups in de app: een eigen mapje "backups" binnen BuildCalc, niet in Downloads.
// Alleen de app zelf ziet deze map; via "Back-up naar Google Drive" zet je er een kopie buiten.
const APP_BACKUPS = 'backups', APP_BACKUPS_HOUD = 30;
async function appBackups() {
  try {
    const r = await plugin('Filesystem').readdir({ path: APP_BACKUPS, directory: 'DATA' });
    return (r?.files || []).map(f => typeof f === 'string' ? { name: f, mtime: 0 } : f).filter(f => /\.json$/i.test(f.name))
      .sort((a, b) => (+b.mtime || 0) - (+a.mtime || 0) || b.name.localeCompare(a.name));
  } catch { return []; }
}
async function appBackupBewaar(naam, data) {
  const fs = plugin('Filesystem');
  await fs.writeFile({ path: `${APP_BACKUPS}/${naam}`, data, directory: 'DATA', recursive: true });
  // Alleen de nieuwste 30 bewaren, zodat het mapje niet blijft groeien.
  for (const f of (await appBackups()).slice(APP_BACKUPS_HOUD)) await fs.deleteFile({ path: `${APP_BACKUPS}/${f.name}`, directory: 'DATA' }).catch(() => {});
}
async function appBackupLees(naam) {
  const r = await plugin('Filesystem').readFile({ path: `${APP_BACKUPS}/${naam}`, directory: 'DATA', encoding: 'utf8' });
  return typeof r.data === 'string' ? r.data : await r.data.text();
}

// Live update: bij het starten kijken of er op GitHub Pages een nieuwere versie staat.
// De nieuwe versie draait op hetzelfde adres in de app, dus projecten, foto's, metingen en
// TopCalc-codes (localStorage en IndexedDB) blijven gewoon staan.
const versieGetal = v => String(v).split(/[.-]/).map(n => +n || 0);

async function zoekUpdate(handmatig = false) {
  const up = plugin('CapacitorUpdater');
  if (!up) { if (handmatig) toast('De update-functie ontbreekt in deze app. Bouw de app één keer opnieuw op de pc.'); return; }
  if (UPD.bezig) { if (handmatig) toast('Ik ben al aan het zoeken…'); return; }
  const zet = (s, v) => { UPD.status = s; if (v) UPD.versie = v; UPD.melden(); };
  // Elke stap heeft een tijdslimiet, zodat de knop nooit stil blijft hangen.
  try { await metLimiet(up.notifyAppReady(), 3000); } catch {}
  if (!navigator.onLine) { zet('offline'); if (handmatig) toast('Geen internet. Probeer het later opnieuw.'); return; }
  UPD.bezig = true; zet('zoeken'); if (handmatig) toast('Zoeken naar een nieuwe versie…');
  try {
    const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), 15000);
    const r = await fetch(UPDATE_URL + 'versie.json?t=' + Date.now(), { cache: 'no-store', signal: ctrl.signal }).finally(() => clearTimeout(t));
    if (!r.ok) throw new Error(`versie.json niet gevonden (fout ${r.status})`);
    const info = await r.json();
    if (!info?.versie || !nieuwer(info.versie, APP_VERSIE)) { zet('actueel'); if (handmatig) toast(`Je hebt de nieuwste versie (${APP_VERSIE}).`); return; }
    zet('downloaden', info.versie); toast(`Nieuwe versie ${info.versie} wordt gedownload…`);
    if (!info.checksum) throw new Error('controlegetal ontbreekt in versie.json');
    // Al eerder gedownload maar voor Later gekozen? Dan niet opnieuw downloaden, alleen opnieuw vragen.
    const bundel = UPD.bundel?.version === info.versie ? UPD.bundel
      : await metLimiet(up.download({ url: new URL(info.zip, UPDATE_URL).href, version: info.versie, checksum: info.checksum }), 180000, 'downloaden duurde te lang');
    UPD.bundel = bundel;
    zet('nieuw', info.versie);
    if (!await bevestig('Nieuwe versie klaar', `Versie ${info.versie} staat klaar. Je projecten en foto's blijven bewaard. Nu herstarten?`, { ja: 'Nu herstarten', nee: 'Later', klasse: 'primary' })) {
      await up.next({ id: bundel.id }); toast('De nieuwe versie start de volgende keer dat je de app opent.'); return;
    }
    if (projecten.length) await backupMaken(null, true);
    await up.set({ id: bundel.id });
  } catch (e) {
    console.warn('Update zoeken mislukt', e); UPD.fout = e.name === 'AbortError' ? 'GitHub gaf geen antwoord' : e.message || String(e); zet('fout');
    if (handmatig) toast('Update lukte niet: ' + UPD.fout);
  } finally { UPD.bezig = false; }
}

const Spraak = {

  melden() { [...this.luisteraars].forEach(f => f()); },
  start(onTekst) {
    this.fout = null;
    if (Native) { NativeSpraak.start(this, onTekst).catch(e => { this.fout = e.message || String(e); this.aan = false; this.melden(); }); return; }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { this.fout = 'Deze browser heeft geen spraakherkenning. Gebruik Chrome of Safari, of typ de tekst.'; return this.melden(); }
    try {
      const r = new SR(); this.rec = r;
      r.lang = 'nl-NL'; r.interimResults = true; r.continuous = false;
      r.onresult = e => {
        const tekst = [...e.results].map(x => x[0].transcript).join(' ').trim();
        onTekst(tekst, e.results[e.results.length - 1].isFinal);
      };
      r.onerror = e => {
        this.fout = { 'not-allowed': 'Geef de pagina toestemming voor de microfoon. Open hem in Chrome of Safari als dat hier niet lukt.',
          'service-not-allowed': 'Spraakherkenning is hier geblokkeerd. Open de pagina in Chrome of Safari, of typ de tekst.',
          'no-speech': 'Ik heb niets gehoord. Probeer het nog eens.',
          network: 'Spraakherkenning heeft hier internet nodig. Typ de tekst of probeer het later.' }[e.error]
          || 'Spraakherkenning gaf een fout: ' + e.error;
        this.melden();
      };
      r.onend = () => { this.aan = false; this.melden(); };
      r.start(); this.aan = true; this.melden();
    } catch (e) { this.fout = 'Spraakherkenning starten mislukt: ' + e.message; this.aan = false; this.melden(); }
  },

// ---------- Bluetooth-lasermeter (Leica DISTO en Bosch GLM) ----------
// Elke meter heeft een of meer meetkanalen. Oudere DISTO's sturen de afstand op 3ab10101,
// nieuwere (zoals de D2) op 3ab1010d. Vinden we geen bekend kanaal, dan luisteren we op elk

    start: [0xC0, 0x55, 0x02, 0x01, 0x00, 0x1A],
    decodeer: dv => (dv.byteLength >= 11 && dv.getUint8(0) === 0xC0 && dv.getUint8(1) === 0x55 && dv.getUint8(2) === 0x10 && dv.getUint8(3) === 0x06)

        <div class="menu" id="llijst" style="max-height:45vh;overflow:auto"></div>
        <div class="actions"><button id="lopnieuw">Opnieuw zoeken</button><button id="lstop">Annuleren</button></div>`;
      // Stil (automatisch): dezelfde lijst, maar onzichtbaar.

        await stopScan();

};

function koppelMic(knop, melding, rust, onTekst) {

    if (Spraak.fout) melding.textContent = Spraak.fout;

      const p0 = postenVoorNotitie(v, '')[0] || {}, m0 = herken(zonderExtra(v)), b = p0.breedte ?? m0.breedte, h = p0.hoogte ?? m0.hoogte;

// ---------- maat op een lijn: typen, inspreken of lasermeter ----------
const veldMaat = m => m.toFixed(3).replace(/0$/, '').replace('.', ',');
// Maat invullen in cm, of tellen in stenen: lagen hoog (6,2 cm per laag) of stenen plat (22 cm per steen).
// Intern blijft de maat in meters, zoals de lasermeter hem geeft.
const STEEN = { cm: { t: 'In cm', w: 0.01, ph: 'Bijv. 120' }, lagen: { t: 'Lagen hoog', w: 0.062, ph: 'Aantal lagen', u: '6,2 cm per laag' }, stenen: { t: 'Stenen plat', w: 0.22, ph: 'Aantal stenen', u: '22 cm per steen' } };
const getal = t => { const v = parseFloat(String(t).replace(',', '.')); return isFinite(v) ? v : null; };
function maatSheet(lijn) {
  const richting = lijn.richting === 'horizontaal' ? 'horizontale' : 'verticale', metMic = !V?.p?.simpel;
  let bron = 'hand', soort = 'cm';
  const kantoorTellen = opKantoorNu();   // stenen of lagen tellen kan alleen op kantoor
  const s = sheet(`<h2>Maat voor ${richting} lijn</h2>
    <div class="seg" id="mSoort" style="margin:0 0 12px"></div>
    <div style="display:flex;gap:16px;align-items:center">
      <label class="field" style="flex:1;margin:0"><span id="mLbl">Maat in cm</span><input id="mt" inputmode="decimal" style="font-size:22px;font-weight:600"
        value="${lijn.maat != null ? String(Math.round(lijn.maat * 1000) / 10).replace('.', ',') : ''}"></label>
      ${metMic ? `<button class="mic" id="mMic" aria-label="Inspreken">${ic('mic')}</button>` : ''}
    </div>
    <div id="mUit" style="font-size:18px;font-weight:600;color:var(--a2);margin:10px 0 0 4px;min-height:1.2em"></div>
    <div id="mMelding" class="melding"></div>
    <div id="mLaser" style="margin-top:14px"></div>
    <div class="actions" style="justify-content:space-between">${lijn.maat != null ? '<button id="mWis">Maat wissen</button>' : '<span></span>'}<button class="primary" id="mOk" style="width:auto;padding:12px 24px;margin:0">Opslaan</button></div>`);
  const inp = $('#mt', s), melding = $('#mMelding', s);
  const naarMaat = () => { const v = getal(inp.value); return v == null ? null : Math.round(v * STEEN[soort].w * 10000) / 10000; };
  const toon = () => {
    const soorten = Object.entries(STEEN).filter(([k]) => k === 'cm' || kantoorTellen || soort === k);
    $('#mSoort', s).hidden = soorten.length < 2;
    $('#mSoort', s).innerHTML = soorten.map(([k, o]) => `<button data-soort="${k}" class="${k === soort ? 'on' : ''}">${o.t}</button>`).join('');
    $('#mLbl', s).textContent = soort === 'cm' ? 'Maat in cm' : `${STEEN[soort].ph} (${STEEN[soort].u})`;
    inp.placeholder = STEEN[soort].ph;
    const m = naarMaat(); $('#mUit', s).textContent = m != null && soort !== 'cm' ? `= ${maatLabel(m)}` : '';
  };
  $('#mSoort', s).onclick = e => { const b = e.target.closest('[data-soort]'); if (!b) return; soort = b.dataset.soort; inp.value = ''; toon(); inp.focus(); };
  inp.oninput = () => { bron = 'hand'; toon(); };
  toon();
  let gevraagd = null;
  const opslaan = () => {
    // "4 stijlen" mag ook, eventueel met een maat ervoor: "120 4 stijlen".
    const { aantal, rest } = splitsAantal(inp.value.trim());
    // Getypte maat is altijd in cm. Lijkt hij in meters getypt (2,45), dan eerst vragen.
    if (rest && soort === 'cm' && bron === 'hand' && gevraagd !== inp.value) { const v = getal(rest);
      const dec = (/[.,](\d+)\s*$/.exec(rest) || [, ''])[1].length;
      // In meters getypt herken je aan twee of meer cijfers achter de komma (2,45 of 2,453 van de laser), of een heel kleine maat (2,5).
      // Een plint van 7,5 cm is gewoon een maat.
      // Geen bovengrens: een daklijst of goot van een flat is zo 25 meter of meer.
      const vraag = v == null ? '' : v > 0 && v < 10 && dec && (dec >= 2 || v < 5) ? `${rest} cm is erg klein. Bedoel je ${String(Math.round(v * 100))} cm (${rest} meter)? Typ dan ${String(Math.round(v * 100))}.` : '';
      if (vraag) { gevraagd = inp.value; melding.textContent = `${vraag} Klopt ${rest} cm toch, tik dan nog een keer op Opslaan.`; melding.classList.add('fout'); return; } }
    if (aantal != null) lijn.aantal = aantal;
    if (rest) { inp.value = rest; const maat = naarMaat(); if (maat == null) { melding.textContent = soort === 'cm' ? 'Vul een maat in cm in, bijvoorbeeld 120.' : 'Vul een aantal in, bijvoorbeeld 12.'; melding.classList.add('fout'); return; }
      if (lijn.stenen && Math.abs(maat - lijn.maat) > 0.004) delete lijn.stenen; delete lijn.uitRef; lijn.maat = maat; lijn.bron = bron; }
    else if (aantal == null) { delete lijn.uitRef; lijn.maat = null; lijn.bron = null; delete lijn.stenen; }
    bewaar(); afsluiten(); tekenUI();
  };
  const afsluiten = () => { Spraak.stop(); Laser.opMeting = V ? laserOpLijn : null; Laser.luisteraars.delete(laserUpdate); sluit(s); };
  s.onclick = e => { if (e.target === s) afsluiten(); };
  $('#mOk', s).onclick = opslaan;
  inp.onkeydown = e => { if (e.key === 'Enter') opslaan(); };
  if ($('#mWis', s)) $('#mWis', s).onclick = () => { inp.value = ''; opslaan(); };
  if (metMic) koppelMic($('#mMic', s), melding, '', (tekst, klaar = true) => {
    if (!klaar) { melding.textContent = `"${tekst}"…`; return; } // pas invullen als de zin af is
    const { aantal, rest } = splitsAantal(tekst);
    const r = herken(rest);
    if (r.eersteMaat != null) { soort = 'cm'; inp.value = String(Math.round(r.eersteMaat * 1000) / 10).replace('.', ','); bron = 'spraak'; toon(); }
    if (aantal != null) { lijn.aantal = aantal; bewaar(); tekenUI(); }
    const type = V && typeUitTekst(rest, V.s.naam);
    if (type) { foto().type = type; bewaar(); tekenUI(); melding.textContent = `"${tekst}" → ${type.code} ${type.naam}`; return; }
    melding.textContent = r.eersteMaat != null || aantal != null ? `"${tekst}"` + (aantal != null ? ` → ${aantal} stijlen` : '') : `Geen maat verstaan in "${tekst}".`;
    if (r.eersteMaat != null) setTimeout(() => { if (s.isConnected) opslaan(); }, 700);
  });
  const laserUpdate = () => { $('#mLaser', s).innerHTML = laserKnopHtml(); koppelLaserKnop($('#mLaser', s)); };
  Laser.luisteraars.add(laserUpdate); laserUpdate();
  // Laser: direct opslaan zonder bevestiging en door naar de volgende open lijn.
  Laser.opMeting = m => { afsluiten(); V.sel = lijn.id; laserOpLijn(m); };
  setTimeout(() => inp.focus(), 60);
}

// ---------- heen en terug: één project tussen telefoon en kantoor (pc), samenvoegen zonder iets kwijt te raken ----------
// Bij het versturen onthoudt dit toestel de verstuurde versie (de "basis"). Komt het project terug, dan vergelijkt de app
// basis, eigen versie en binnengekomen versie per onderdeel (map, foto, lijn, notitie, stap):
// alleen aan één kant veranderd → die verandering; aan beide kanten anders → de nieuwste wint; nieuw aan één kant → erbij.

// PDF delen zonder op te slaan. true = gedeeld, false = geannuleerd.
async function deelPdf(blob, naam, titel, tekst) {
  if (Native) {
    const { uri } = await plugin('Filesystem').writeFile({ path: naam, data: await naarBase64(blob), directory: 'CACHE' });
    try { await plugin('Share').share({ title: titel, text: tekst, files: [uri], dialogTitle: titel }); return true; }
    catch (e) { if (/cancel/i.test(e?.message || '')) return false; throw e; }
  }
  const bestand = new File([blob], naam, { type: blob.type || 'application/pdf' }), data = { files: [bestand], title: titel, text: tekst };
  if (!navigator.canShare?.({ files: [bestand] })) {
    // Deze browser kan geen bestanden delen: dan alleen de mail met het overzicht.
    toast('Deze browser kan de PDF niet direct delen. De mail opent met het overzicht; de PDF kun je apart opslaan.');
    location.href = `mailto:?subject=${encodeURIComponent(titel)}&body=${encodeURIComponent(tekst)}`;
    return true;
  }
  const deel = async () => { try { await navigator.share(data); return true; } catch (e) { if (e?.name === 'AbortError') return false; throw e; } };
  try { return await deel(); }
  catch (e) {
    if (e?.name !== 'NotAllowedError') throw e;
    // Het maken van de PDF duurde te lang voor de telefoon: nog één tik om te delen.
    return new Promise(res => {
      const d = dialoog(`<h2>Rapport klaar</h2><div>De PDF staat klaar om te delen via WhatsApp, mail of een andere app.</div>
        <div class="actions"><button id="dNee">Annuleren</button><button id="dJa" class="primary">Delen</button></div>`, () => res(false));
      $('#dNee', d).onclick = () => { sluit(d); res(false); };
      $('#dJa', d).onclick = async () => { sluit(d); try { res(await deel()); } catch (f) { toast('Delen lukte niet: ' + f.message); res(false); } };
    });
  }
}

// AutoHotkey-script (v2) voor de pc: typt de regels in Topcalc, met Tab tussen de vakken en Enter na elke regel.

function topcalcScript(p, kaarten, mappen = '') {
  // In AutoHotkey v2 is "" geen escape: een aanhalingsteken in tekst wordt `" en een nieuwe regel `n.
  const q = v => '"' + String(v).replace(/`/g, '``').replace(/"/g, '`"').replace(/\r?\n/g, '`n') + '"';

  return `; BuildCalc -> Topcalc, ${p.adres}${p.werknummer ? ' (' + p.werknummer + ')' : ''}
; 1. Installeer AutoHotkey v2 (gratis): https://www.autohotkey.com
; 2. Dubbelklik dit bestand.
; 3. Maak in Topcalc eerst deze mappen aan (Nieuw > bestek > straatnaam > gevel) (het script laat dit lijstje ook zien):

; 4. Open in Topcalc de meetstaat van ${kaarten[0][0]} en klik in het eerste vakje (Code).
; 5. Druk op F9. Het script vraagt eerst of de goede map openstaat; pas na OK typt het de regels.
;    Daarna zegt het welke map de volgende is.
;    ${kaarten.length} ${kaarten.length === 1 ? 'map' : 'mappen'}, ${totaal} regels. Esc stopt het script.

REGEL := "{Enter}" ; na Bestek: regel opslaan

TYPE_LENGTE := 2   ; na zoveel tekens springt Topcalc zelf van Type naar Omschrijving
; Per map: naam (bestek > map) en regels (Code, Type, Omschrijving, Breedte, Hoogte, Strekkend, Aantal, Bestek).

${kaarten.map(([naam, rijen]) => `  [${q(naam)}, [\n${rijen.map(r => '    [' + r.map(q).join(', ') + ']').join(',\n')}\n  ]]`).join(',\n')}
]
MAPPEN := ${q(mappen)}
nr := 1
MsgBox("Maak in Topcalc eerst deze mappen aan:\`n\`n" MAPPEN "\`n\`nOpen daarna de meetstaat van " kaarten[1][1] ", klik in het eerste vakje (Code) en druk op F9.", "BuildCalc")

    SendText(r[2])

    if (StrLen(r[2]) < TYPE_LENGTE)

}

    { naam: 'Opname', kop: TOPCALC_KOLOMMEN, rijen: [...posten].sort((a, b) => (!a.object - !b.object) || postCode(a).localeCompare(postCode(b))).map(postRij), breedtes: [8, 10, 45, 10, 8, 28, 16, 11, 11, 11, 10, 50] },
    { naam: 'Maten', kop: ['Locatie', 'Foto', 'TopCalc code', 'Lijn', 'Richting', 'Maat (m)', 'Aantal stijlen/dorpels', 'Bron'],
      rijen: maten.map(x => [x.locatie, x.foto, x.code, x.nr, x.lijn.richting === 'horizontaal' ? 'Horizontaal' : 'Verticaal', x.lijn.maat, lijnAantal(x.lijn), x.lijn.bron || (x.lijn.maat == null ? 'open' : '')]), breedtes: [16, 6, 12, 6, 12, 10, 12, 10] },
    { naam: 'Project', kop: ['Veld', 'Waarde'], rijen: [['Adres', p.adres], ['Werknummer', p.werknummer], ['Klant', p.klant], ...bagRijen(p), ...planRijen(p)], breedtes: [14, 60] },
  ]);
  $('#rpXlsx').onclick = () => exporteer('xlsx', async () => download(excel(), bestandsnaam(p, 'xlsx')));
  $('#rpPdf').onclick = () => exporteer('pdf', async () => download(await maakPdf(p, posten), bestandsnaam(p, 'pdf')));
  // Versturen: de PDF wordt in het geheugen gemaakt en direct aan het deelscherm gegeven (WhatsApp, mail enz.).
  // Er wordt niets gedownload; daarvoor zijn de knoppen "Alleen PDF/Excel opslaan".
  $('#rpStuur').onclick = () => exporteer('stuur', async () => {
    const blob = await maakPdf(p, posten);
    if (!await deelPdf(blob, bestandsnaam(p, 'pdf'), `Opname ${p.werknummer}, ${p.adres}`, mailTekst(p))) return;
    p.verstuurd = new Date().toISOString(); RP.projectId = p.id; bewaar();
    // In de app daarna stil een back-up van dit project in het BuildCalc-mapje (geen download).
    if (Native) await backupMaken(p, true);
  });
  const ov = $('#rpOngedaan'); if (ov) ov.onclick = () => { delete p.verstuurd; bewaar(); render(); };
  m.querySelectorAll('[data-leer]').forEach(b => b.onclick = () => {
    const r = regels[+b.dataset.leer];
    menu([['table', 'Topcalc-code kiezen', async () => {
      const n = p.submappen.flatMap(s => s.notities || []).find(x => x.tekst === r.opmerking); if (!n) return;
      const code = await codeKiezer(notitieLabel(n.tekst) || 'Topcalc-code'); if (code) { n.code = code; bewaar(); render(); }
    }], ['leer', 'Woord leren', () => woordLeren(r.opmerking)]]);
  });
  m.querySelectorAll('[data-sleutel]').forEach(b => b.onclick = async () => {
    const k = b.dataset.sleutel, huidig = koppelingen.find(([x]) => x === k)[1];
    const standaard = postCode(postenVoorNotitie(huidig.opmerking, huidig.locatie, () => null)[0]);
    const code = await codeKiezer(sleutelLabel(k), postCode(huidig), true);
    if (code == null) return;
    zetCode(k, code === standaard ? '' : code); render();
  });
}

// ---------- kleine UI-hulpjes ----------
function sheet(html) {
  const s = document.createElement('div'); s.className = 'scrim';
  s.innerHTML = `<div class="sheet"><div class="handle"></div>${html}</div>`;
  s.onclick = e => { if (e.target === s) sluit(s); };
  // Als het toetsenbord opent, het veld waarin je typt in beeld houden.
  s.addEventListener('focusin', e => { if (e.target.matches('input, textarea')) setTimeout(() => e.target.scrollIntoView({ block: 'center' }), 300); });
  document.body.appendChild(s); return s;
}
function dialoog(html, bijSluiten) {
  const s = document.createElement('div'); s.className = 'scrim center';
  s.innerHTML = `<div class="dialog">${html}</div>`;
  s.onclick = e => { if (e.target === s) { sluit(s); bijSluiten?.(); } };
  document.body.appendChild(s); return s;
}
const sluit = s => s.remove();
function menu(items) {
  const s = sheet('<div class="menu">' + items.map(([i, l], n) =>
    `<button data-n="${n}" style="${i === 'trash' ? 'color:var(--danger)' : ''}"><span style="color:${i === 'trash' ? 'var(--danger)' : 'var(--gold)'}">${ic(i)}</span>${l}</button>`).join('') + '</div>');
  s.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { sluit(s); items[+b.dataset.n][2](); });
}
function bevestig(titel, tekst, { ja = 'Verwijderen', nee = 'Annuleren', klasse = 'danger' } = {}) {
  return new Promise(res => {
    const d = dialoog(`<h2>${titel}</h2><div style="color:var(--muted)">${esc(tekst)}</div>
      <div class="actions"><button id="nee">${nee}</button><button id="ja" class="${klasse}">${ja}</button></div>`, () => res(false));
    $('#nee', d).onclick = () => { sluit(d); res(false); };
    $('#ja', d).onclick = () => { sluit(d); res(true); };
  });
}
// Melding met een knop om het terug te draaien (15 seconden).
function ongedaanToast(t, terug) {
  const d = document.createElement('div'); d.className = 'toast'; d.style.cssText = 'display:flex;align-items:center;gap:10px';
  d.innerHTML = `<span style="flex:1">${esc(t)}</span><button class="outline" style="flex:none;width:auto;padding:6px 12px">Ongedaan maken</button>`;
  // Kort zichtbaar (6 s) en weg zodra je ergens anders klikt, zodat je meteen verder kunt.
  document.body.appendChild(d); const weg = () => { clearTimeout(w); d.remove(); removeEventListener('pointerdown', buiten, true); };
  const buiten = e => { if (!d.contains(e.target)) weg(); }, w = setTimeout(weg, 6000);
  setTimeout(() => addEventListener('pointerdown', buiten, true), 0);
  d.querySelector('button').onclick = () => { weg(); terug(); toast('Teruggezet.'); };
}
function toast(t, ms = 3500) {
  const d = document.createElement('div'); d.className = 'toast'; d.textContent = t;
  document.body.appendChild(d); setTimeout(() => d.remove(), ms);
}

// ---------- instellingen: thema en taal ----------
// Alleen de bediening wordt vertaald. Spraakherkenning, schilderstermen, Topcalc-codes en het rapport blijven Nederlands.
const TAAL_KEY = 'buildcalc.taal', THEMA_KEY = 'buildcalc.thema';
const leesInst = (k, d) => { try { return localStorage.getItem(k) || d; } catch { return d; } };
let taal = leesInst(TAAL_KEY, 'nl'), thema = leesInst(THEMA_KEY, 'donker');
function zetThema(t) {
  thema = t; try { localStorage.setItem(THEMA_KEY, t); } catch {}
  document.documentElement.dataset.theme = { licht: 'light', zon: 'zon' }[t] || 'dark';
  document.querySelector('meta[name=theme-color]')?.setAttribute('content', { licht: '#F8F7F4', zon: '#ffffff' }[t] || '#12110D');
}
zetThema(thema);
// Diktekant: bij schilderwerk (ONB, ONI) schilder je bij een raam of deur die open kan ook de dikte van één kant mee.
// Daarom komt er dan in de Topcalc-lijst een paar cm bij de breedte (standaard 5). Op de foto blijft de echte maat staan.
// Vaste ramen, panelen, kozijnen en glas krijgen niks. Per onderdeel aan of uit te zetten (o.dikte = true/false).
const DIKTE_KEY = 'buildcalc.diktekant';
let dikteCm = (() => { const v = leesInst(DIKTE_KEY, ''); return v === '' ? 5 : Math.max(0, Number(v) || 0); })();
const DRAAIT = /raam|deur|luik|klep|venster/i, NIET_DRAAIT = /vast|paneel|kozijn|glas|pui/i;
const dikteVanNaam = o => DRAAIT.test(o?.naam || '') && !NIET_DRAAIT.test(o?.naam || '');
function diktekant(o, bestek) {
  if (!dikteCm || !['ONB', 'ONI'].includes(bestek) || o?.dikte === false) return 0;
  return o?.dikte === true || dikteVanNaam(o) ? dikteCm : 0;
}
const GROOT_KEY = 'buildcalc.groot';
let groot = leesInst(GROOT_KEY, '') === '1';
function zetGroot(aan) { groot = aan; try { localStorage.setItem(GROOT_KEY, aan ? '1' : ''); } catch {} document.documentElement.toggleAttribute('data-groot', aan); }
zetGroot(groot);

const ontbreekt = new Set(), bekend = new Set(Object.values(VERTALING).flat());
function vertaalKern(k, i, diep = 0) {
  if (k in VERTALING) return VERTALING[k][i];
  if (bekend.has(k)) return null;
  for (const [re, ...v] of VERTAAL_PATRONEN) {
    const m = k.match(re);
    if (m) return v[i].replace(/\$(\d)/g, (_, n) => { const d = m[+n] ?? ''; return vertaalKern(d, i, diep + 1) ?? d; });
  }
  for (const sep of [' • ', '. ']) if (k.includes(sep)) {
    const delen = k.split(sep), uit = delen.map(d => d.trim() ? vertaalKern(d.trim(), i, diep + 1) : d);
    if (uit.some(x => x != null)) return uit.map((x, n) => x ?? delen[n]).join(sep);
  }
  if (!diep && /[a-z]{3}/i.test(k) && !/^\d/.test(k)) ontbreekt.add(k);
  return null;
}
function vertaalTekst(t) {
  const k = t.trim(); if (!k || taal === 'nl') return t;
  const v = vertaalKern(k, taal === 'en' ? 0 : 1);
  return v == null || v === k ? t : t.replace(k, v);
}
// Gebruikersgegevens (namen, notities, invoer) en maatlijnen nooit vertalen.
const nietVertalen = el => !el || !!el.closest?.('[data-nt], svg, textarea, option[data-nt]');
const gesloten = el => !!el.closest?.('[data-nt], svg');
function vertaalBoom(root) {
  if (taal === 'nl' || !root) return;
  if (root.nodeType === 3) { if (!nietVertalen(root.parentElement)) { const v = vertaalTekst(root.data); if (v !== root.data) root.data = v; } return; }
  if (root.nodeType !== 1 || gesloten(root)) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT, {
    acceptNode: n => n.nodeType === 1 ? (gesloten(n) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT) : nietVertalen(n.parentElement) ? NodeFilter.FILTER_SKIP : NodeFilter.FILTER_ACCEPT });
  for (let n = root; n; n = w.nextNode()) {
    if (n.nodeType === 3) { const v = vertaalTekst(n.data); if (v !== n.data) n.data = v; continue; }
    for (const a of ['placeholder', 'aria-label', 'title']) if (n.hasAttribute?.(a)) { const v = vertaalTekst(n.getAttribute(a)); if (v !== n.getAttribute(a)) n.setAttribute(a, v); }
  }
}
new MutationObserver(lijst => { if (taal === 'nl') return; for (const m of lijst) {
  if (m.type === 'characterData') vertaalBoom(m.target); else m.addedNodes.forEach(vertaalBoom);
} }).observe(document.body, { childList: true, subtree: true, characterData: true });
