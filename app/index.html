n}\n\nfunction item(it, d){\n  const isD = l => l===d ? ' doel' : '';\n  const dat = l => ` data-l=\"${esc(l)}\"`;\n  switch(it.k){\n    case 'kop': return `<div class=\"kop\">${esc(it.l)}</div>`;\n    case 'tekst': return `<div class=\"tekst\">${esc(it.l)}</div>`;\n    case 'ok': return `<div class=\"ok\">${esc(it.l)}</div>`;\n    case 'veld': return `<div class=\"el veld\">${esc(it.l)}</div>`;\n    case 'rij': return `<div class=\"el rij${isD(it.l)}\"${dat(it.l)}>${esc(it.l)}${it.s?`<small>${esc(it.s)}</small>`:''}</div>`;\n    case 'knop': return `<div class=\"el knop${isD(it.l)}\"${dat(it.l)}>${esc(it.l)}</div>`;\n    case 'knop2': return `<div class=\"el knop2${isD(it.l)}\"${dat(it.l)}>${esc(it.l)}</div>`;\n    case 'seg': case 'chips': {\n      const aan = [].concat(it.aan||[]);\n      return `<div class=\"${it.k}\">${it.l.map(l=>`<span class=\"el${aan.includes(l)?' aan':''}${isD(l)}\"${dat(l)}>${esc(l)}</span>`).join('')}</div>`; }\n    case 'gevel': return `<div class=\"gevel\"><b>${esc(it.l)}</b><span class=\"el${isD(it.l)}\"${dat(it.l)}>Foto maken</span></div>`;\n    case 'foto': return `<div class=\"el foto${isD(it.l)}\"${dat(it.l)}>${fotoSvg(it.lijn)}</div>`;\n    case 'sluiter': return `<div class=\"el sluiter${isD(it.l)}\"${dat(it.l)} aria-label=\"Maak foto\"></div>`;\n    case 'teller': return `<div class=\"teller\">${esc(it.l)}<i><b>−</b>${it.n}<b class=\"el${isD(it.l)}\"${dat(it.l)}>+</b></i></div>`;\n    case 'melding': return `<div class=\"el melding${isD(it.l)}\"${dat(it.l)}>${esc(it.l)}<small>${esc(it.s)}</small></div>`;\n    case 'meet': return `<div class=\"el meet${isD(it.l)}\"${dat(it.l)}><span>${esc(it.l)}</span><span>${esc(it.a)}</span><em class=\"${it.c?'':'leeg'}\">${it.c?esc(it.c):'code?'}</em></div>`;\n    case 'spraak': return `<div class=\"spraak\"><div class=\"golf\">🎤</div><div>${esc(it.l)}</div></div>`;\n  }\n  return '';\n}\n\n// ---- tekenen ----\nconst $ = id => document.getElementById(id);\nconst esc = s => String(s).replace(/
